openapi: 3.1.0
info:
  title: Personal Agent Platform API
  version: 0.1.0
  description: |
    REST API of the Personal Agent backend (the `api` process).

    **This file is the contract.** The api must implement it exactly: requests and responses are
    validated against it in tests. The web app generates its client types from it. Change this
    file first, then the code.

    Not covered here:
    - `/mcp`: the Platform MCP, which speaks the MCP protocol (streamable HTTP), not REST.
    - `/git`: the git gateway, which speaks git smart HTTP.
      Both are for user containers only and answer 404 from the internet.
    - Backend ↔ vm-manager: gRPC, defined in `vm-manager/proto/vm/v1/vm.proto`.

    Conventions:
    - Auth: Clerk session JWT as `Authorization: Bearer <token>` on every `/v1` route.
    - Lists use cursor pagination (`cursor`, `limit`); responses carry `nextCursor` (null at the end).
    - Money is in US cents; credits are integers (1 credit = $0.01 of price).
    - Errors always use the `Error` schema. A 500 `internal` error gives the request id as
      `details.requestId`, so a report can quote it.
    - Every answer carries an `X-Request-Id` header: the id the server logs this request under.
      A caller may send its own `X-Request-Id` (up to 64 letters, digits, `_` or `-`); it is kept,
      otherwise the server makes one. Not repeated under each route.
    - Any signed-in route can answer 403 `account_suspended` while an admin has suspended the
      account (see `POST /v1/admin/users/{userId}/suspend`), and 429 `rate_limited` from the
      per-address limit. Neither is repeated under each route.
servers:
  - url: https://api.example.com
    description: Production (replace with the real domain)
  - url: http://localhost:8080
    description: Local development

security:
  - clerkAuth: []

tags:
  - name: system
  - name: me
  - name: channels
  - name: chat
  - name: approvals
  - name: apps
  - name: mcp-servers
  - name: byok
  - name: automations
  - name: agent
  - name: memory
  - name: billing
  - name: credits
  - name: coupons
  - name: activity
  - name: admin
  - name: waitlist
  - name: webhooks

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }

  # ---------------------------------------------------------------- me
  /v1/me:
    get:
      operationId: getMe
      tags: [me]
      summary: Current user profile, plan and balance summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      operationId: updateMe
      tags: [me]
      summary: Update profile settings
      description: |
        A `timezone` (an IANA name such as `Asia/Kolkata`, 400 for an unknown one) also makes
        `timezoneSet` true.

        `onboardingCompleted` and `gettingStartedDismissed` are the web app's first-run marks (see
        `Me`). `true` stamps the time now, or keeps the time already there; `false` clears it. Only
        the signed-in user's own marks change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------- channels
  /v1/channels:
    get:
      operationId: listChannels
      tags: [channels]
      summary: Linked chat apps, and which channels are switched on
      description: |
        `available` lists the channels that are switched on for this deployment (the
        `ENABLED_CHANNELS` setting; at launch `telegram` and `web`). Offer only these: a link code
        for any other channel is refused with 403 `channel_disabled`. `web` means web chat.
        `items` can still hold a link to a channel that was switched off later, so it can be unlinked.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, available]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ChannelLink" }
                  available:
                    type: array
                    description: Channels that are switched on, in the order they are configured.
                    items: { $ref: "#/components/schemas/ChannelType" }
                    examples: [[telegram, web]]
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/channels/link-codes:
    post:
      operationId: createLinkCode
      tags: [channels]
      summary: Create a one-time code to link a chat app
      description: |
        The user sends the returned code to our Telegram bot (or WhatsApp / iMessage number).
        Single use, expires after 10 minutes. Rate limited.
        Only for a channel that is switched on (`available` in `GET /v1/channels`); otherwise
        403 `channel_disabled`. `web` needs no linking (400).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { $ref: "#/components/schemas/ChannelType" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkCode" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ChannelDisabled" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/channels/{channelLinkId}:
    delete:
      operationId: unlinkChannel
      tags: [channels]
      summary: Unlink a chat app
      parameters:
        - $ref: "#/components/parameters/ChannelLinkId"
      responses:
        "204": { description: Unlinked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- chat
  /v1/messages:
    get:
      operationId: listMessages
      tags: [chat]
      summary: Chat history (newest first)
      description: |
        Which messages are listed:
        - with `conversationId`: that conversation's messages (any channel; 404 if it isn't this
          user's);
        - with `channel=web` and no `conversationId`: the messages of the web chat's active
          conversation (none if web chat has no conversation yet);
        - with another `channel` and no `conversationId`: every message of that channel;
        - with neither: every message of every channel.

        Every message carries its `conversationId`.

        `chatStartedAt` is kept for older clients: when the web chat's newest conversation started,
        or null if the user never started a new chat in web chat.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: channel
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ChannelType" }
        - name: conversationId
          in: query
          required: false
          description: List only this conversation's messages.
          schema: { type: string, examples: [cnv_01jz3m8q4kd2v7x9w0t5b6c8ya] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor, chatStartedAt]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
                  nextCursor: { type: [string, "null"] }
                  chatStartedAt:
                    type: [string, "null"]
                    format: date-time
                    description: |
                      For older clients. When the web chat's newest conversation started; null if
                      the user never started a new chat there.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: sendMessage
      tags: [chat]
      summary: Send a message to the agent from the web app
      description: |
        Queued like any other channel message. The reply arrives on the SSE stream.
        Returns 402 when the balance is zero, and 403 `channel_disabled` when web chat is switched
        off (`web` is not in `available`, see `GET /v1/channels`).

        The message goes into the web chat's active conversation. With `conversationId` it goes
        into that web conversation instead, which becomes the active one first: the agent then
        continues that conversation's own context, not the latest one's. 404 if the conversation
        isn't this user's; 409 if it is not a web conversation (a Telegram conversation can only be
        read in the web app).

        The Automations chat (`kind: automations`) can be written in too: the agent continues the
        context of the automations' runs there. It never becomes the active one, so the next
        message sent without `conversationId` still goes into the active conversation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, clientMessageId]
              properties:
                text: { type: string, minLength: 1, maxLength: 8000 }
                clientMessageId:
                  type: string
                  format: uuid
                  description: Idempotency key; resending the same id does not create a second message.
                attachmentIds:
                  type: array
                  items: { type: string }
                  maxItems: 5
                conversationId:
                  type: string
                  description: |
                    The web conversation to write in. Left out: the active one. A conversation that
                    is not active becomes the active one first, except the Automations chat, which
                    is never the active one.
      responses:
        "202":
          description: Accepted and queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/OutOfCredits" }
        "403": { $ref: "#/components/responses/ChannelDisabled" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/conversations:
    get:
      operationId: listConversations
      tags: [chat]
      summary: The user's conversations (newest `lastMessageAt` first)
      description: |
        A chat is one channel thread (web chat, or one Telegram chat). A conversation is one
        stretch of a chat between two "New chat" actions; the agent keeps a separate context for
        each. Saved memories (`/v1/memories`) are shared by all of them.

        Without `channel`, every channel's conversations are listed. Web conversations can be
        opened and written in; Telegram conversations are listed for reading only (Telegram always
        writes in its chat's latest one, and `/new` there starts a new one).

        Every run of every automation answers in one conversation of its own, the Automations chat
        (`kind: automations`, at most one per user). `kind=chat` leaves it out of the list, and
        `kind=automations` lists only it (an empty list until the first automation is made or
        runs), so a client can pin it apart from the dated list.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: channel
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ChannelType" }
        - name: kind
          in: query
          required: false
          description: Only conversations of this kind. Left out, both kinds are listed.
          schema: { $ref: "#/components/schemas/ConversationKind" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Conversation" }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createConversation
      tags: [chat]
      summary: Start a new web conversation
      description: |
        Starts a new, empty conversation in web chat and makes it the active one. The agent starts
        with a fresh context there: it does not see what was said in other conversations. Saved
        memories are kept; they are not part of a conversation. No body.

        Web chat only (a Telegram chat starts a new one with the message `/new`). No turn runs and
        no credits are charged. Rate limited to 30 an hour per user, counted together with
        `POST /v1/chats/new`.
      responses:
        "201":
          description: Started; it is the active web conversation now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/conversations/{conversationId}:
    patch:
      operationId: updateConversation
      tags: [chat]
      summary: Rename a conversation, or make a web conversation the active one
      description: |
        `title` renames it (any channel). `active: true` makes a web conversation the active one:
        web chat's next message goes there and the agent continues that conversation's own
        context. A Telegram conversation cannot be made active from the web (409). At least one of
        the two fields is required.

        The Automations chat keeps its name and is never the active one: both fields answer 409
        for it. It can be opened and written in all the same (`POST /v1/messages` with its id).
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1, maxLength: 80 }
                active: { type: boolean, const: true }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteConversation
      tags: [chat]
      summary: Delete a conversation with its messages and files
      description: |
        Removes the conversation, its messages and their attachments. The activity log gets
        `conversation_deleted` (the channel, never any text). Deleting the active web conversation
        makes the newest remaining web conversation the active one, or starts an empty one when
        none is left. After the active conversation of a Telegram chat is deleted, the next message
        from that chat starts a new one.

        The Automations chat cannot be deleted (409): every automation's runs answer there, so it
        stays for as long as the account does. Deleting the account removes it with everything
        else.
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/chats/new:
    post:
      operationId: startNewChat
      tags: [chat]
      summary: Start a new web chat (older name of `POST /v1/conversations`)
      deprecated: true
      description: |
        Kept for older clients; it does what `POST /v1/conversations` does and shares its limit of
        30 an hour per user. No body.

        The answer's `chatStartedAt` is when the new conversation started, the same value
        `GET /v1/messages` returns from now on.
      responses:
        "200":
          description: Started
          content:
            application/json:
              schema:
                type: object
                required: [chatStartedAt]
                properties:
                  chatStartedAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/attachments:
    post:
      operationId: uploadAttachment
      tags: [chat]
      summary: Upload a file for a web message
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                required: [id, name, sizeBytes, mimeType]
                properties:
                  id: { type: string }
                  name: { type: string }
                  sizeBytes: { type: integer }
                  mimeType: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: File too large
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/stream:
    get:
      operationId: streamEvents
      tags: [chat]
      summary: Live updates (Server-Sent Events)
      description: |
        One long-lived SSE connection per browser tab. Event types:
        `message.created`, `message.status`, `message.draft`, `approval.created`, `approval.resolved`,
        `agent.status`, `agent.progress`, `credits.updated`, `automation.updated`,
        `conversation.updated`, `conversation.deleted`.
        Each event's `data` is JSON matching the `StreamEvent` schema.

        `message.created` and `message.status` carry the whole message, so its `conversationId`
        comes with it. `conversation.updated` carries the whole conversation: it is sent when one
        starts, and when its `title`, `lastMessageAt` or `active` changes. `conversation.deleted`
        carries the deleted conversation's `id` only.

        `agent.progress` is a short line about what the agent is doing in the current turn (for
        example `Scout: reading 4 pages` or `using web_search`). It is live only: it isn't saved
        as a message and isn't sent to Telegram. Lines that name a crew member are also in the
        activity log.

        `message.draft` is the answer the agent is writing, so far, in a turn whose answer goes to
        web chat (`MessageDraft`). Each one holds the whole draft, not only what was added, so a
        missed one does no harm: the next one has all of it. It is live only, like a progress line:
        nothing is saved for it and it never goes to Telegram or another chat app. The answer itself
        still arrives as `message.created`. How to show it:
        - Show the latest draft of the turn (`turnId`) in the draft's conversation, in place of the
          "working" state. An empty `text` means the agent started over (a new message, or it went
          on to a tool): show the working state again.
        - When a `message.created` from the agent (`direction: out`, no `approvalId`) arrives in
          that conversation, it replaces the draft. That message can arrive just before the last
          draft of the turn, so drop any later draft of the same turn.
        - Clear the draft when the turn ends: `agent.status` other than `busy`, or the incoming
          message (`messageId`) moving to `delivered` or `failed`. A failed turn ends with an
          apology (`message.created`) and no answer.
        - Drafts and the end of their turn are sent in order, so no draft of a turn comes after its
          end. After a reconnect, the next draft (if the turn still runs) brings the whole text back.
        Browsers can't set headers on EventSource, so the token may be passed as `?token=`.
      parameters:
        - name: token
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/StreamEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------- approvals
  /v1/approvals:
    get:
      operationId: listApprovals
      tags: [approvals]
      summary: Approvals (default pending)
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ApprovalStatus" }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Approval" }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/approvals/{approvalId}/decision:
    post:
      operationId: decideApproval
      tags: [approvals]
      summary: Approve or reject a pending action
      parameters:
        - name: approvalId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
      responses:
        "200":
          description: Recorded; the answer is sent to the agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already decided or expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------------------------------------------------------------- apps (Composio)
  /v1/apps:
    get:
      operationId: listApps
      tags: [apps]
      summary: App catalog with connection status and plan availability
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/App" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/apps/{appSlug}/connect:
    post:
      operationId: connectApp
      tags: [apps]
      summary: Start connecting an app (returns the provider login URL)
      description: |
        `redirectUrl` is the provider's own sign-in page when the app is set up with our own sign-in
        app at the provider, and Composio's connect page otherwise. After signing in, the browser
        comes back to `returnUrl` (default: the web app's `/apps?connected=<appSlug>`) with
        `status=success` or `status=failed` added by Composio. Only the app list says for sure that
        the connection is active.

        An app the server may set up by itself (`COMPOSIO_MANAGED_APPS`) gets its Composio setup on
        the first connect; that is when the first user can wait a second longer.
      parameters:
        - name: appSlug
          in: path
          required: true
          schema: { type: string, examples: [gmail] }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                returnUrl:
                  type: string
                  format: uri
                  description: Where to send the user after connecting (must be our web app's domain).
      responses:
        "200":
          description: Redirect the browser to `redirectUrl`
          content:
            application/json:
              schema:
                type: object
                required: [redirectUrl]
                properties:
                  redirectUrl: { type: string, format: uri }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PlanLimit" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Composio could not be reached, or could not make the app's setup. Nothing was saved. Retry later
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/connections/{connectionId}:
    delete:
      operationId: disconnectApp
      tags: [apps]
      summary: Disconnect an app
      parameters:
        - name: connectionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Disconnected }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /oauth/callback:
    get:
      operationId: oauthCallback
      tags: [apps]
      summary: The way back from an app's sign-in, through our own address, on to Composio
      description: |
        For an app set up with our own sign-in app at the provider (our own GitHub or Google OAuth
        app), when that sign-in app's redirect address is `https://<api domain>/oauth/callback`.
        After the user allows access, the provider sends the browser here, and this answers 302 to
        Composio's callback (`COMPOSIO_API_URL` + `/api/v3/toolkits/auth/callback`) with the query
        string unchanged. Composio then finishes the connection and sends the browser back to the
        web app. It saves nothing, adds no job and never logs the query (it holds a one-time code).
      security: []
      responses:
        "302":
          description: On to Composio's callback, with the same query string
          headers:
            Location:
              schema: { type: string, format: uri }

  # ---------------------------------------------------------------- user MCP servers
  /v1/mcp-servers:
    get:
      operationId: listMcpServers
      tags: [mcp-servers]
      summary: The user's own MCP servers (Max plan)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/McpServer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createMcpServer
      tags: [mcp-servers]
      summary: Add an MCP server
      description: The domain is added to the user's egress allowlist. The secret is stored encrypted and never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/McpServerCreate" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpServer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PlanLimit" }

  /v1/mcp-servers/{mcpServerId}:
    patch:
      operationId: updateMcpServer
      tags: [mcp-servers]
      summary: Enable/disable or rename
      parameters:
        - $ref: "#/components/parameters/McpServerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 60 }
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpServer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteMcpServer
      tags: [mcp-servers]
      summary: Remove an MCP server
      parameters:
        - $ref: "#/components/parameters/McpServerId"
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- bring your own key
  /v1/byok:
    get:
      operationId: listByokKeys
      tags: [byok]
      summary: Which providers have a user key set (keys are never returned)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ByokKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/byok/{provider}:
    put:
      operationId: setByokKey
      tags: [byok]
      summary: Set or replace the user's own API key for a provider
      description: |
        The key is test-called with the provider, saved encrypted, and then put in use: when the
        user's own key is what pays for their AI, every model call from their agent goes to this
        provider with this key. If the AI gateway cannot be switched to the key, nothing is saved
        and the answer is 503. When several keys are saved, the one saved last pays.
      parameters:
        - $ref: "#/components/parameters/Provider"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apiKey]
              properties:
                apiKey: { type: string, minLength: 10, writeOnly: true }
                model:
                  type: string
                  maxLength: 128
                  pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
                  description: |
                    The provider's model id to use with this key (e.g. `claude-opus-5-5`, or
                    `openai/gpt-6.1-sol` on OpenRouter). Left out: the provider's default, shown
                    in `effectiveModel`.
      responses:
        "200":
          description: Saved (the key is test-called before saving)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ByokKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: The AI gateway could not be switched to this key; nothing was saved. Retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteByokKey
      tags: [byok]
      summary: Remove the user's key for a provider
      description: |
        The agent stops using the key first. If the AI gateway cannot be switched away from it,
        nothing is removed, the key stays in use, and the answer is 503.
      parameters:
        - $ref: "#/components/parameters/Provider"
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: The AI gateway could not be switched away from this key; it was not removed. Retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------------------------------------------------------------- automations
  /v1/automations:
    get:
      operationId: listAutomations
      tags: [automations]
      summary: The user's automations and reminders
      description: |
        Automations are created by chatting with the agent; the web app can list, pause and delete
        them. A repo with pull-request review on is an automation too (`preset: pr_review`); it is
        turned on and off with `/v1/pr-reviews`.

        Every run answers in the Automations chat (`GET /v1/conversations?kind=automations`), never
        in the user's other conversations. An automation made in a Telegram chat also sends a copy
        of each run's answer to that chat.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Automation" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/automations/{automationId}:
    patch:
      operationId: updateAutomation
      tags: [automations]
      summary: Pause or resume
      parameters:
        - $ref: "#/components/parameters/AutomationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Automation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteAutomation
      tags: [automations]
      summary: Delete (timer or trigger is removed too)
      parameters:
        - $ref: "#/components/parameters/AutomationId"
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/pr-reviews:
    get:
      operationId: listPrReviews
      tags: [automations]
      summary: The GitHub repos that have pull-request review on
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PrReviewRepo" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/pr-reviews/{owner}/{repo}:
    put:
      operationId: enablePrReview
      tags: [automations]
      summary: Turn on pull-request review for one GitHub repo
      description: |
        When a pull request in this repo is opened or gets new commits, the agent has Patch review
        it, posts one review on the pull request and sends a short verdict to the Automations chat
        (see `Conversation.kind`). When the user has a linked Telegram chat, a copy of the verdict
        goes there too.

        Turning it on is the user's standing approval for one thing: posting a new review or
        comment on a pull request **in this repo**. Those run without a per-comment approval.
        Everything else risky (merging, approving, a comment on another repo) still asks.

        GitHub must be connected (409 otherwise). Each repo counts as one automation of the plan's
        limit (403 `plan_limit` when it is used up). Each review costs what a turn costs plus
        1 credit for the posted review. Calling it again for a repo that is already on returns the
        same repo (and resumes it if it was paused).
      parameters:
        - $ref: "#/components/parameters/RepoOwner"
        - $ref: "#/components/parameters/RepoName"
      responses:
        "200":
          description: Review is on for this repo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrReviewRepo" }
        "400":
          description: |
            Not a GitHub repo name, or GitHub would not let us watch the repo (the connected
            account needs admin access to it).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PlanLimit" }
        "409":
          description: GitHub is not connected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: disablePrReview
      tags: [automations]
      summary: Turn off pull-request review for one GitHub repo
      description: Removes the automation and its trigger. The standing approval for that repo ends.
      parameters:
        - $ref: "#/components/parameters/RepoOwner"
        - $ref: "#/components/parameters/RepoName"
      responses:
        "204": { description: Review is off for this repo }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- crew jobs
  /v1/github/repos:
    get:
      operationId: listGithubRepos
      tags: [agent]
      summary: The repositories of the connected GitHub account, to pick one for a crew job
      description: |
        Asked through Composio's GitHub action for the signed-in account's repositories
        (`GITHUB_LIST_REPOSITORIES_FOR_THE_AUTHENTICATED_USER`): the 100 pushed to most recently
        that the account can see, its own and its organisations'. The answer is kept for 60
        seconds per user. Reading is free.

        409 when GitHub is not connected. 503 when GitHub or Composio can't be asked right now;
        a repository can always be typed as `owner/repo` instead.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/GithubRepo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: GitHub is not connected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: GitHub or Composio can't be asked right now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/crew-jobs:
    get:
      operationId: listCrewJobs
      tags: [agent]
      summary: The user's crew jobs, newest first
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CrewJob" }
                  nextCursor: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createCrewJob
      tags: [agent]
      summary: Give Patch a review or Byte a coding job
      description: |
        A crew job is a brief the user fills in. It runs as one turn of the agent, as soon as the
        user's agent is free: the lead hands it to Patch (a review) or Byte (a change), the
        specialist works in a folder of its own, and at the end every program it started is
        stopped, the folder is deleted and a report comes back. The report always goes to the
        chat named in `reportTo.channel`, and is kept on the job (`report`).

        `reportTo.pullRequest` is the user's yes for one thing only: Patch's report posted as ONE
        review of type comment on that pull request, once, during this job. Byte puts its report
        in the description of the pull request it opens. Approving, requesting changes, merging,
        closing and pushing to the default branch are never covered.

        The job costs what a turn costs, plus 1 credit for each app action that changes something
        (the posted review, the issue, the pull request Byte opens). A job that fails on our side
        is not charged, like any turn.

        Sending the same `clientRequestId` again returns the job it made (200), and makes no
        second one. 400 for a brief that doesn't hold together (see the fields), 402 at zero
        credits, 409 when GitHub is not connected or five jobs are already waiting, 429 after 20
        jobs in an hour.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrewJobInput" }
      responses:
        "200":
          description: This `clientRequestId` made a job before; that job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrewJob" }
        "201":
          description: Saved and queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrewJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/OutOfCredits" }
        "409":
          description: GitHub is not connected, or five jobs are already queued or running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/crew-jobs/{crewJobId}:
    get:
      operationId: getCrewJob
      tags: [agent]
      summary: One crew job, with its report when it is done
      parameters:
        - name: crewJobId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrewJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- agent
  /v1/agent/status:
    get:
      operationId: getAgentStatus
      tags: [agent]
      summary: Whether the user's agent container is asleep, waking, awake or busy
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/agent/settings:
    get:
      operationId: getAgentSettings
      tags: [agent]
      summary: Which agent runs for this user, and which AI source pays for it
      description: |
        Rule: a connected Claude plan → Claude Code (when chosen); an own API key → Hermes;
        neither → Hermes on platform credits, or nothing when the platform requires your own AI
        (`aiAccess: none`).

        `platformAvailable` says whether Textcrew AI (the platform's own AI, paid in credits) is on
        offer. When it is, a user with their own key or Claude plan can still choose it with
        `aiPreference: platform`, and go back with `aiPreference: auto`. `aiAccess` always says
        what pays for the AI right now.

        `claudeModel` and `claudeEffort` are the Claude model and the thinking effort Claude Code
        uses (null: Claude Code's own default). They apply to turns that run on Claude Code, and
        can be set whatever the engine is now. `claudeChoices` lists what may be chosen: every
        Claude model Claude Code can use, each with the effort levels it takes.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      operationId: updateAgentSettings
      tags: [agent]
      summary: Choose the agent runtime, Textcrew AI, or Claude Code's model and effort
      description: |
        Send `runtime`, `aiPreference` or both. A screen with three choices sends:
        own API key → `{ runtime: hermes, aiPreference: auto }`; Claude plan →
        `{ runtime: claude_code, aiPreference: auto }`; Textcrew AI → `{ aiPreference: platform }`.

        `claudeModel` and `claudeEffort` may be sent too, alone or with the others. Null goes back
        to Claude Code's own default. They can be set whatever the engine is now; they take effect
        on turns that run on Claude Code. A model id that isn't in `claudeChoices.models` is
        400 `invalid_request`. Example: `{ claudeModel: claude-opus-5-5, claudeEffort: xhigh }`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                runtime: { $ref: "#/components/schemas/AgentRuntime" }
                aiPreference: { $ref: "#/components/schemas/AiPreference" }
                claudeModel:
                  type: [string, "null"]
                  maxLength: 100
                  description: One of the ids in `claudeChoices.models`, or null for the default.
                  examples: [claude-opus-5-5]
                claudeEffort:
                  type: [string, "null"]
                  enum: [low, medium, high, xhigh, max, null]
                  description: Null for the default.
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSettings" }
        "400":
          description: Invalid input, or a Claude model id that isn't on the list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: |
            Claude Code needs a connected Claude plan first, or Textcrew AI was chosen while it
            isn't on offer (`platformAvailable: false`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/crew:
    get:
      operationId: listCrew
      tags: [agent]
      summary: The crew, the lead and its specialists
      description: |
        Tex is the lead (the agent the user texts). Byte, Patch and Scout are the specialists it
        hands work to. The ids are fixed. `available` says whether a member works on this
        deployment yet. Scout's `browser` says which plan the real browser needs, whether this
        deployment has it (`available`) and whether it is on for the signed-in user (`enabled`).
        Scout's `description` says what else needs that plan: web search through Textcrew is part
        of Max too, while the search built into the user's own Claude plan works on every plan and
        costs no credits.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CrewMember" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/agent/claude/login:
    post:
      operationId: startClaudeLogin
      tags: [agent]
      summary: Start connecting the user's Claude plan (official Claude Code sign-in)
      description: |
        Wakes the user's container and starts the unmodified Claude Code sign-in there. Open
        `authorizeUrl` (Anthropic's own page), sign in, then send the code Anthropic shows to the
        complete endpoint. We never see or store Claude credentials. Rate limited.
      responses:
        "201":
          description: Sign-in started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClaudeLoginStart" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: The agent container is unavailable right now; retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/agent/claude/login/{loginId}/complete:
    post:
      operationId: completeClaudeLogin
      tags: [agent]
      summary: Finish connecting the Claude plan with the code from Anthropic's page
      parameters:
        - name: loginId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code: { type: string, minLength: 4, maxLength: 2000, writeOnly: true }
      responses:
        "200":
          description: Connected; Claude Code is now the user's agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSettings" }
        "400":
          description: Wrong or expired code (the message says which)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/agent/claude:
    delete:
      operationId: disconnectClaude
      tags: [agent]
      summary: Disconnect the Claude plan (signs Claude Code out; the agent goes back to Hermes)
      responses:
        "204": { description: Disconnected }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: The agent container is unavailable right now; retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------------------------------------------------------------- billing
  /v1/billing/plans:
    get:
      operationId: listPlans
      tags: [billing]
      summary: Available plans and top-up packs
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [plans, topUps]
                properties:
                  plans:
                    type: array
                    items: { $ref: "#/components/schemas/Plan" }
                  topUps:
                    type: array
                    items: { $ref: "#/components/schemas/TopUpPack" }

  /v1/billing/subscription:
    get:
      operationId: getSubscription
      tags: [billing]
      summary: Current subscription
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/billing/checkout:
    post:
      operationId: createCheckout
      tags: [billing]
      summary: Start a Polar checkout for a plan or a top-up
      description: |
        Returns a hosted Polar checkout URL. The plan or credits change only when Polar's signed
        webhook arrives, never from this call. Top-ups are only for paid plans.
        Waitlist members (verified email on a non-rejected, unflagged waitlist entry) get 50% off
        their first month of Pro or Max once; `discountApplied` says whether it was applied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/CheckoutPlanRequest"
                - $ref: "#/components/schemas/CheckoutTopUpRequest"
              discriminator:
                propertyName: kind
                mapping:
                  plan: "#/components/schemas/CheckoutPlanRequest"
                  topup: "#/components/schemas/CheckoutTopUpRequest"
      responses:
        "200":
          description: Redirect the browser to `checkoutUrl`
          content:
            application/json:
              schema:
                type: object
                required: [checkoutUrl, discountApplied]
                properties:
                  checkoutUrl: { type: string, format: uri }
                  discountApplied:
                    type: boolean
                    description: The waitlist offer (50% off the first month) is on this checkout.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PlanLimit" }

  /v1/billing/subscription/cancel:
    post:
      operationId: cancelSubscription
      tags: [billing]
      summary: Cancel at the end of the current period
      responses:
        "200":
          description: Cancellation scheduled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: No active paid subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------------------------------------------------------------- credits
  /v1/credits:
    get:
      operationId: getCredits
      tags: [credits]
      summary: Balance and the grants it is made of
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditBalance" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/credits/ledger:
    get:
      operationId: listLedger
      tags: [credits]
      summary: Credit history (grants, charges, expiries, refunds)
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LedgerEntry" }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/usage:
    get:
      operationId: getUsage
      tags: [credits]
      summary: Usage per period (AI, awake time, app actions, browser time, paid tools) between two dates
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, totals]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/UsagePeriod" }
                  totals: { $ref: "#/components/schemas/UsageTotals" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------- coupons
  /v1/coupons/redeem:
    post:
      operationId: redeemCoupon
      tags: [coupons]
      summary: Redeem a coupon code for free credits
      description: |
        Rules (see HLD 7.7): verified email and at least one linked chat app required;
        max 5 attempts per user per hour and 20 per IP per hour; one redemption per user per coupon.
        Every failure (wrong, expired, used up, disabled, not eligible) returns the **same**
        400 `invalid_or_expired_code`, so codes can't be probed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 8
                  maxLength: 40
                  examples: [AGT-7KQ2-M9XP-4RWD]
      responses:
        "200":
          description: Redeemed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CouponRedemption" }
        "400":
          description: invalid_or_expired_code (generic on purpose)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ---------------------------------------------------------------- memory
  /v1/memories:
    get:
      operationId: listMemories
      tags: [memory]
      summary: What the agent has saved about this user
      description: |
        The shared memory (HLD 0.9): short facts the agent saved about the user, given to
        whichever engine runs. Memories are made by chatting with the agent; the web app can
        list and delete them, not add or edit them. All of them come in one answer, newest
        first: there are at most `max`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, max]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Memory" }
                  max:
                    type: integer
                    description: The most memories a user can have. At the limit the agent can't save more.
                    examples: [200]
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      operationId: deleteAllMemories
      tags: [memory]
      summary: Delete every memory of this user
      description: Can't be undone. The agent starts again with nothing saved about the user.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: integer, description: How many memories were removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/memories/{memoryId}:
    delete:
      operationId: deleteMemory
      tags: [memory]
      summary: Delete one memory
      parameters:
        - $ref: "#/components/parameters/MemoryId"
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- activity
  /v1/activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: Audit log of everything the agent did for this user
      description: |
        A `run_app_action` entry carries `creditsCharged`: 1 for a successful action that changed
        something, 0 for one that only read. A `web_search` entry carries what the search cost
        (1 credit). A `web_search_refused` entry is a search that did not run because web search
        through Textcrew is part of the Max plan and the user is on another plan; it cost nothing.
        A `read_page_refused` entry is a web address the agent asked to read and was not allowed to.
        A `crew_progress` entry is a progress line from a specialist; `crew` names it.
        `browser_enabled` and `browser_disabled` (actor `system`): Scout's browser was switched on
        or off for the user, because their plan changed or the deployment got or lost the browser.
        Memory (HLD 0.9): `remember` (the agent saved a memory), `forget` (it removed or corrected
        one), `recall` (it searched), `memory_refused` (a save was refused because it looked like
        a secret), `memory_deleted` and `memories_cleared` (the user deleted in the web app).
        These carry `memoryId` where there is one. They never carry the memory's text: show it
        from `GET /v1/memories`.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ActivityEntry" }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------- admin
  /v1/admin/coupons:
    get:
      operationId: adminListCoupons
      tags: [admin]
      summary: List coupons (admin)
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Coupon" }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: adminCreateCoupon
      tags: [admin]
      summary: Create a coupon campaign (admin)
      description: |
        Returns the plaintext code(s) **once**; only hashes are stored.
        `codeCount: 1` creates one shared code with `maxRedemptions` uses;
        `codeCount > 1` creates that many single-use codes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CouponCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [coupon, codes]
                properties:
                  coupon: { $ref: "#/components/schemas/Coupon" }
                  codes:
                    type: array
                    items: { type: string }
                    description: Plaintext codes, shown only in this response.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/coupons/{couponId}:
    patch:
      operationId: adminUpdateCoupon
      tags: [admin]
      summary: Disable/enable a coupon, optionally revoking unspent credits (admin)
      parameters:
        - name: couponId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
                revokeUnspentCredits: { type: boolean, default: false }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Coupon" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/users/{userId}/credits:
    post:
      operationId: adminAdjustCredits
      tags: [admin]
      summary: Manually adjust a user's credits (admin)
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, reason, idempotencyKey]
              properties:
                amount: { type: integer, description: "Positive adds credits; negative removes them" }
                reason: { type: string, maxLength: 200 }
                expiresAt:
                  type: [string, "null"]
                  format: date-time
                  description: Omitted = 90 days from now (like every grant); null = never expires.
                idempotencyKey: { type: string }
      responses:
        "200":
          description: Adjusted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditBalance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/stats/free-credits:
    get:
      operationId: adminFreeCreditStats
      tags: [admin]
      summary: Free credits granted this month vs the monthly cap (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [month, signupCredits, couponCredits, capCredits, capReached]
                properties:
                  month: { type: string, examples: ["2026-10"] }
                  signupCredits: { type: integer }
                  couponCredits: { type: integer }
                  capCredits: { type: [integer, "null"] }
                  capReached: { type: boolean }
                  abuseFlags:
                    type: array
                    items:
                      type: object
                      properties:
                        ip: { type: string }
                        redemptions: { type: integer }
                        userIds: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------- admin: one user's apps, chats and automations
  # Support tools. Every action goes through the same module function as the user's own, and
  # writes an audit row with the admin's id and the required reason. No Composio account ids,
  # tokens or secrets, and chat ids only masked.
  /v1/admin/overview:
    get:
      operationId: adminOverview
      tags: [admin]
      summary: The platform's numbers at a glance (admin)
      description: |
        Counts only: no name, email, id or text. "Today" starts at midnight UTC; "7 days" is the
        last 7 × 24 hours. Turn counts come from the turn timings, which are kept 30 days.
        `containers.awake` is null when the vm-manager can't be asked, and `jobs.failed` when the
        job queues can't be read; the other numbers still come.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: Users, newest first, with search (admin)
      description: |
        Deleted accounts are listed too, marked `deleted`. The balance is worked out from the
        user's grants, as everywhere else. Never a message, a memory, a key or a token.
      parameters:
        - name: query
          in: query
          required: false
          description: Part of an email or a name (any letter case), or a whole user id.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminUser" }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/users/{userId}/apps:
    get:
      operationId: adminListUserApps
      tags: [admin]
      summary: One user's app connections (admin)
      description: |
        Every connection the user has, in any state, newest first, from our own table. Composio is
        not asked: use the recheck for that.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminUserApp" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/users/{userId}/apps/{connectionId}/disconnect:
    post:
      operationId: adminDisconnectUserApp
      tags: [admin]
      summary: Disconnect one of a user's apps (admin)
      description: |
        The same as the user's own disconnect: the account is removed at Composio and the
        connection is deleted. App-event automations on that app are left as the user's own
        disconnect leaves them. Audited with the admin's id and the reason.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - name: connectionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 200, pattern: '\S' }
      responses:
        "204": { description: Disconnected }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/users/{userId}/apps/{connectionId}/recheck:
    post:
      operationId: adminRecheckUserApp
      tags: [admin]
      summary: Ask Composio about one of a user's connections again (admin)
      description: |
        Runs the connection check now, whatever the connection's state: Composio is asked about
        this account and its answer is copied (`ACTIVE` → active, `EXPIRED` → expired, `FAILED`
        → error). An account Composio no longer has becomes `error`. One still being set up stays
        `pending` and gets a fresh series of checks. Audited with the admin's id and the reason.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - name: connectionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 200, pattern: '\S' }
      responses:
        "200":
          description: Checked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRecheckResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Composio can't be asked right now. Nothing changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/admin/users/{userId}/channels:
    get:
      operationId: adminListUserChannels
      tags: [admin]
      summary: One user's linked chats (admin)
      description: The chat id itself is never returned, only a masked form.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminUserChannel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/users/{userId}/channels/{channelLinkId}/unlink:
    post:
      operationId: adminUnlinkUserChannel
      tags: [admin]
      summary: Unlink one of a user's chats (admin)
      description: |
        The same as the user's own unlink (`DELETE /v1/channels/{channelLinkId}`), with the same
        `channel_unlinked` entry in the user's activity log, marked as done by an admin. The chat
        then gets the "not linked yet" reply. Audited with the admin's id and the reason.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/ChannelLinkId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 200, pattern: '\S' }
      responses:
        "204": { description: Unlinked }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/users/{userId}/automations:
    get:
      operationId: adminListUserAutomations
      tags: [admin]
      summary: Every automation of one user, finished one-time reminders too (admin)
      description: Newest first. The instruction text and the trigger's settings are left out.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminUserAutomation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/automations/{automationId}/pause:
    post:
      operationId: adminPauseAutomation
      tags: [admin]
      summary: Pause any user's automation (admin)
      description: |
        The same as the user's own pause (its timer is removed; app events for it are ignored), with
        `pausedReason: admin`, so the user sees it was paused by Textcrew. Adding credits does not
        resume it. 409 for a one-time reminder that already ran. Audited with the admin's id and
        the reason.
      parameters:
        - $ref: "#/components/parameters/AutomationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 200, pattern: '\S' }
      responses:
        "200":
          description: Paused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserAutomation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/admin/automations/{automationId}/resume:
    post:
      operationId: adminResumeAutomation
      tags: [admin]
      summary: Resume any user's automation (admin)
      description: |
        The same as the user's own resume: its timer is set again and its failure count goes back
        to 0. 409 for a one-time reminder that already ran. Audited with the admin's id and the
        reason.
      parameters:
        - $ref: "#/components/parameters/AutomationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 200, pattern: '\S' }
      responses:
        "200":
          description: Resumed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserAutomation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/admin/automations/{automationId}:
    delete:
      operationId: adminDeleteAutomation
      tags: [admin]
      summary: Delete any user's automation (admin)
      description: |
        The same as the user's own delete: its timer goes, and its Composio trigger with it (for
        pull-request review, the watch on the repo, and with it the standing approval). Audited
        with the admin's id and the reason.
      parameters:
        - $ref: "#/components/parameters/AutomationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 200, pattern: '\S' }
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/apps/summary:
    get:
      operationId: adminAppsSummary
      tags: [admin]
      summary: Per app, how many users connected it and whether it can be connected here (admin)
      description: Numbers only, one row per app in the catalog.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminAppSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------- admin: operations (jobs, audit, timings, config, health)
  /v1/admin/jobs:
    get:
      operationId: adminListJobs
      tags: [admin]
      summary: Jobs in the queues, by queue and state (admin)
      description: |
        Newest first within a queue. Without `queue`, the four queues are paged one after the
        other (inbound, outbound, scheduled, system). `waiting` includes the jobs waiting with a
        priority (paid users' inbound turns). `data` holds ids only: every other field of the job's
        data is left out and only its name is listed in `omittedKeys`, so no message text, token
        or key is ever shown. `failedReason` is the error's first line, with anything that looks
        like a secret removed.
      parameters:
        - name: queue
          in: query
          required: false
          schema: { type: string, enum: [inbound, outbound, scheduled, system] }
        - name: state
          in: query
          required: false
          schema:
            { type: string, enum: [failed, waiting, active, delayed, completed], default: failed }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        [id, queue, name, state, attempts, maxAttempts, createdAt, processedAt,
                         finishedAt, dueAt, failedReason, userId, data, omittedKeys]
                      properties:
                        id: { type: string }
                        queue: { type: string, enum: [inbound, outbound, scheduled, system] }
                        name: { type: string, examples: [process-message] }
                        state:
                          { type: string, enum: [failed, waiting, active, delayed, completed] }
                        attempts: { type: integer, description: Tries made so far }
                        maxAttempts: { type: integer }
                        createdAt: { type: string, format: date-time }
                        processedAt: { type: [string, "null"], format: date-time }
                        finishedAt: { type: [string, "null"], format: date-time }
                        dueAt:
                          type: [string, "null"]
                          format: date-time
                          description: When a delayed job becomes due. Null for any other job.
                        failedReason:
                          type: [string, "null"]
                          description: First line of the last error, at most 300 characters, secrets removed.
                        userId: { type: [string, "null"] }
                        data:
                          type: object
                          description: The ids in the job's data (fields named `id` or ending in `Id`/`Ids`). Nothing else.
                          additionalProperties:
                            anyOf:
                              - { type: string }
                              - { type: number }
                              - { type: array, items: { type: string } }
                        omittedKeys:
                          type: array
                          items: { type: string }
                          description: Names of the data fields left out. Their values are never shown.
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/jobs/counts:
    get:
      operationId: adminJobCounts
      tags: [admin]
      summary: How many jobs each queue holds, by state (admin)
      description: "`waiting` includes the jobs waiting with a priority."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [queues]
                properties:
                  queues:
                    type: array
                    items:
                      type: object
                      required: [queue, failed, waiting, active, delayed, completed]
                      properties:
                        queue: { type: string, enum: [inbound, outbound, scheduled, system] }
                        failed: { type: integer }
                        waiting: { type: integer }
                        active: { type: integer }
                        delayed: { type: integer }
                        completed: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/jobs/{queue}/{jobId}/retry:
    post:
      operationId: adminRetryJob
      tags: [admin]
      summary: Run a failed job once more (admin)
      description: |
        Only a failed job. It goes back in line and runs once more, as the "retry" button of the
        queue board does: its own "already done?" checks decide what is left to do, so nothing is
        done twice. Written to the audit log with the admin's id and the reason.
      parameters:
        - name: queue
          in: path
          required: true
          schema: { type: string, enum: [inbound, outbound, scheduled, system] }
        - name: jobId
          in: path
          required: true
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "204": { description: Back in line }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/admin/jobs/{queue}/{jobId}:
    delete:
      operationId: adminRemoveJob
      tags: [admin]
      summary: Remove a failed or finished job (admin)
      description: |
        Only a failed or a completed job; never one that is waiting, delayed or running (409).
        Written to the audit log with the admin's id and the reason. The job's event, if it has
        one, keeps its status in the database.
      parameters:
        - name: queue
          in: path
          required: true
          schema: { type: string, enum: [inbound, outbound, scheduled, system] }
        - name: jobId
          in: path
          required: true
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "204": { description: Removed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/admin/audit:
    get:
      operationId: adminListAudit
      tags: [admin]
      summary: The audit log of every user, newest first (admin)
      description: |
        Every entry of the activity log: what users, agents, admins and the system did. Filters
        combine. `from` and `to` bound the entry's time (`to` excluded). `details` comes with
        every field that looks like a secret replaced by "[redacted]".
      parameters:
        - name: userId
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
        - name: actor
          in: query
          required: false
          schema: { type: string, enum: [user, agent, admin, system] }
        - name: action
          in: query
          required: false
          schema: { type: string, maxLength: 64, examples: [credits_adjusted] }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, userId, actor, action, summary, details, creditsCharged, createdAt]
                      properties:
                        id: { type: string }
                        userId: { type: [string, "null"] }
                        actor: { type: string, enum: [user, agent, admin, system] }
                        action: { type: string, examples: [job_retried, credits_adjusted] }
                        summary: { type: string }
                        details:
                          type: [object, "null"]
                          additionalProperties: true
                          description: The entry's details, secrets replaced by "[redacted]".
                        creditsCharged: { type: [integer, "null"] }
                        createdAt: { type: string, format: date-time }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/timings/summary:
    get:
      operationId: adminTimingsSummary
      tags: [admin]
      summary: Where turns spent their time over the last days (admin)
      description: |
        From the turn timings only (kept 30 days). Per stage, as long as it kept the user waiting:
        how many turns had it, the median and the 90th percentile in milliseconds. The wake is
        split by kind (warm, cold, capacity, recreated). `total` is the time from the message
        being queued to the answer. Then the turns per route, engine and outcome, and the 20
        slowest turns with their biggest stage. Never any text.
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 30, default: 7 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [days, since, turns, stages, routes, engines, outcomes, slowest]
                properties:
                  days: { type: integer }
                  since: { type: string, format: date-time }
                  turns: { type: integer, description: Turns in the window }
                  stages:
                    type: array
                    items:
                      type: object
                      required: [stage, count, p50Ms, p90Ms]
                      properties:
                        stage:
                          type: string
                          examples: [queue, route, wake cold, wake warm, engine start, first output, work, send answer, total]
                        count: { type: integer }
                        p50Ms: { type: integer }
                        p90Ms: { type: integer }
                  routes:
                    type: array
                    items:
                      type: object
                      required: [name, count]
                      properties:
                        name: { type: string, description: "The route, or `none` for a turn that ended before routing" }
                        count: { type: integer }
                  engines:
                    type: array
                    items:
                      type: object
                      required: [name, count]
                      properties:
                        name: { type: string, description: "hermes, claude_code, or `none`" }
                        count: { type: integer }
                  outcomes:
                    type: array
                    items:
                      type: object
                      required: [name, count]
                      properties:
                        name: { type: string }
                        count: { type: integer }
                  slowest:
                    type: array
                    maxItems: 20
                    items:
                      type: object
                      required:
                        [deliveryId, userId, startedAt, totalMs, biggestStage, biggestStageMs, route,
                         engine, wake, outcome]
                      properties:
                        deliveryId: { type: string }
                        userId: { type: string }
                        startedAt: { type: string, format: date-time }
                        totalMs: { type: integer }
                        biggestStage: { type: [string, "null"] }
                        biggestStageMs: { type: [integer, "null"] }
                        route: { type: [string, "null"] }
                        engine: { type: [string, "null"] }
                        wake: { type: [string, "null"] }
                        outcome: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/timings/requests:
    get:
      operationId: adminRequestTimes
      tags: [admin]
      summary: How long the api's own requests took, per route (admin)
      description: |
        Response times of the api's HTTP requests (not turns: see `/v1/admin/timings/summary`).
        Each request's time is counted in Redis, in a time bucket, per route and status class:
        per 5 minutes (kept 2 hours) and per hour (kept 8 days). Nothing is written to the
        database per request.

        `window` is the last hour (read from 5-minute slots), the last 24 hours or the last 7
        days (hourly slots). The current slot is included, so the window reaches back up to one
        slot further; `since` is the start of the oldest slot read.

        A route is the method and the route pattern, never the address with ids, e.g.
        `GET /v1/conversations/:conversationId`; `GET (no route)` holds unknown addresses and
        requests refused before routing. The health check and `/metrics` are not counted.
        Percentiles are estimated from the buckets and are accurate to one bucket (at most about
        a third of the value, usually much closer); `maxMs` is exact. The time is until the
        answer starts: for the live stream, until the stream opens. `overall` is every request
        together. Routes are sorted by p95, slowest first. Never a user, an address or a query.
      parameters:
        - name: window
          in: query
          required: false
          schema: { type: string, enum: ["1h", "24h", "7d"], default: "24h" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [window, since, until, overall, routes]
                properties:
                  window: { type: string, enum: ["1h", "24h", "7d"] }
                  since: { type: string, format: date-time, description: Start of the oldest slot read }
                  until: { type: string, format: date-time, description: When the answer was made }
                  overall: { $ref: "#/components/schemas/AdminRouteTimes" }
                  routes:
                    type: array
                    items: { $ref: "#/components/schemas/AdminRouteTimes" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/config:
    get:
      operationId: adminGetConfig
      tags: [admin]
      summary: The settings that shape behaviour, read-only (admin)
      description: |
        Built from a fixed list, never by reading the whole environment. `settings` are the
        settings that are not secret: switches, limits, lists and addresses (without any user
        name or password in them). For each secret, `secrets` says only whether it is set. `apps`
        is the app catalog with whether each app can be connected on this server, and how.
        `AWAKE_CAP` is the vm-manager's own setting: the backend can't read it, so its value is
        null.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [environment, settings, secrets, apps]
                properties:
                  environment: { type: string, enum: [development, test, production] }
                  settings:
                    type: array
                    items:
                      type: object
                      required: [name, group, value]
                      properties:
                        name: { type: string, examples: [CREW_AVAILABLE] }
                        group: { type: string, examples: [crew] }
                        value:
                          anyOf:
                            - { type: string }
                            - { type: number }
                            - { type: boolean }
                            - { type: array, items: { type: string } }
                            - { type: "null" }
                        note: { type: string }
                  secrets:
                    type: array
                    items:
                      type: object
                      required: [name, set]
                      properties:
                        name: { type: string, examples: [COMPOSIO_API_KEY] }
                        set: { type: boolean }
                  apps:
                    type: array
                    items:
                      type: object
                      required: [slug, name, connectable, setup]
                      properties:
                        slug: { type: string }
                        name: { type: string }
                        connectable: { type: boolean }
                        setup:
                          type: string
                          enum: [settings, made_by_server, server_may_make, none]
                          description: |
                            `settings`: named in COMPOSIO_AUTH_CONFIGS. `made_by_server`: the server
                            made it earlier. `server_may_make`: COMPOSIO_MANAGED_APPS lets the server
                            make it on the first connect. `none`: can't be connected here.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/health:
    get:
      operationId: adminGetHealth
      tags: [admin]
      summary: Can the backend reach what it depends on (admin)
      description: |
        Asks Postgres, Redis, the vm-manager, LiteLLM and Composio, each with a 3-second limit, and
        says for each `ok`, `error` or `off` (not set up on this server), with a short message.
        `ok` is true when none is `error`. `version` is the backend's version and the deployed
        commit, when the deploy passed it on (`GIT_COMMIT`).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, checkedAt, version, services]
                properties:
                  ok: { type: boolean }
                  checkedAt: { type: string, format: date-time }
                  version:
                    type: object
                    required: [version, commit, node]
                    properties:
                      version: { type: string, examples: [0.1.0] }
                      commit: { type: [string, "null"], examples: [accd3c4] }
                      node: { type: string, examples: [v22.11.0] }
                  services:
                    type: array
                    items:
                      type: object
                      required: [name, status, message, ms]
                      properties:
                        name: { type: string, enum: [postgres, redis, vm-manager, litellm, composio] }
                        status: { type: string, enum: [ok, error, "off"] }
                        message: { type: string }
                        ms: { type: integer, description: How long the check took }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------- waitlist
  /v1/waitlist:
    post:
      operationId: joinWaitlist
      tags: [waitlist]
      summary: Join the waitlist (public)
      description: |
        No auth. The caller's IP, user agent and request headers are stored with the entry for
        abuse monitoring. The answer is the same whether the email is new or already on the list,
        so emails can't be probed. Rate limited per IP and per email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaitlistJoin" }
      responses:
        "202":
          description: Accepted (new or already on the list)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitlistJoined" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/admin/waitlist:
    get:
      operationId: adminListWaitlist
      tags: [admin]
      summary: Waitlist entries with abuse data (admin)
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/WaitlistStatus" }
        - name: flagged
          in: query
          required: false
          schema: { type: boolean }
        - name: ip
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/WaitlistEntry" }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/waitlist/stats:
    get:
      operationId: adminWaitlistStats
      tags: [admin]
      summary: Waitlist totals and abuse signals (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitlistStats" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/waitlist/{entryId}:
    patch:
      operationId: adminUpdateWaitlistEntry
      tags: [admin]
      summary: Invite, reject or (un)flag an entry (admin)
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                status: { $ref: "#/components/schemas/WaitlistStatus" }
                flagged: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitlistEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- admin: one user's agent and container
  # Every operation here is admin-only. Every change is written to the audit log with the admin's
  # id and the reason. No response carries a container token, a Bridge secret, a LiteLLM key or an
  # API key.
  /v1/admin/users/{userId}/agent:
    get:
      operationId: adminGetUserAgent
      tags: [admin]
      summary: One user's agent and container, as support sees it (admin)
      description: |
        The container as the vm-manager reports it, the engine, whether a Claude plan is connected
        (never its sign-in), Claude Code's model and effort, Scout's browser, what pays for the AI,
        and the usage charged since midnight UTC. When the vm-manager can't be asked, the rest is
        still answered and `container.reachable` is false.
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAgent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/users/{userId}/container/stop:
    post:
      operationId: adminStopContainer
      tags: [admin]
      summary: Stop one user's container now (admin)
      description: |
        A polite stop by default, the way the idle stop does it: Hermes saves to the user's folder
        first. The vm-manager refuses it (409) while a turn runs, a message is being delivered or a
        Claude sign-in waits for its code.

        **`force: true` is dangerous.** It ends the container at once, in the middle of a turn if
        there is one, without letting Hermes save. That turn fails as our fault: the user is told
        "something went wrong on our side" and its credits are given back. Use it only for a turn
        that is stuck.
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500, description: "Why. Kept in the audit log, not shown to the user." }
                force:
                  type: boolean
                  default: false
                  description: "**Dangerous**: stops it even in the middle of a turn (see above)."
      responses:
        "200":
          description: Stopped
          content:
            application/json:
              schema:
                type: object
                required: [container]
                properties:
                  container: { $ref: "#/components/schemas/AdminContainer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such user, or the user has no container
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A polite stop was refused (a turn runs, a delivery is in flight, or a Claude sign-in waits)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: The vm-manager could not be asked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/admin/users/{userId}/container/wake:
    post:
      operationId: adminWakeContainer
      tags: [admin]
      summary: Wake one user's container now (admin)
      description: |
        The same wake a turn makes: the container is made first if the user has none, then started
        and checked for ready; afterwards the engine and the browser switch are set again if they
        differ. It needs the user to have credits, because awake time is charged to them (1 credit
        per 10 minutes; the idle stop puts it back to sleep after 3 quiet minutes).
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500, description: "Why. Kept in the audit log, not shown to the user." }
      responses:
        "200":
          description: Awake
          content:
            application/json:
              schema:
                type: object
                required: [container, wasStopped]
                properties:
                  container: { $ref: "#/components/schemas/AdminContainer" }
                  wasStopped: { type: boolean, description: It was asleep and was started now. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The user is out of credits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: The server is at its awake limit with nothing to stop, or the vm-manager could not be asked. Try again shortly.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/admin/users/{userId}/agent/reset:
    post:
      operationId: adminResetAgent
      tags: [admin]
      summary: Put chosen agent settings back to their defaults (admin)
      description: |
        `engine`: the chosen engine goes back to Hermes (a Claude plan stays connected; the user
        can choose Claude Code again). `model` and `effort`: Claude Code's model and thinking effort
        go back to Default, Claude Code's own choice. `browser`: Scout's browser switch is set again
        from the user's plan and the deployment, as a plan change does. The same functions the user's
        own settings use make each change, so the vm-manager is told the same way.
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, what]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500, description: "Why. Kept in the audit log, not shown to the user." }
                what:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: string, enum: [engine, model, effort, browser] }
      responses:
        "200":
          description: Reset; the agent as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAgent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: The browser switch could not be sent to the vm-manager (the other settings were reset)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/admin/users/{userId}/approvals:
    get:
      operationId: adminListUserApprovals
      tags: [admin]
      summary: One user's approvals, newest first (admin)
      description: |
        Every state unless `status` is given. Only the action's name, its app and the short summary
        the user was shown: never the action's inputs.
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ApprovalStatus" }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminApproval" }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/approvals/{approvalId}/cancel:
    post:
      operationId: adminCancelApproval
      tags: [admin]
      summary: Cancel a waiting approval (admin)
      description: |
        Ends it the way the 24-hour expiry does: it becomes `expired`, the agent is not woken, and
        nothing can run with it. A late tap on its button gets "That approval was already answered
        or has expired". Only a waiting approval can be cancelled (409 otherwise).
      parameters:
        - { name: approvalId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500, description: "Why. Kept in the audit log, not shown to the user." }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminApproval" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/admin/users/{userId}/crew-jobs:
    get:
      operationId: adminListUserCrewJobs
      tags: [admin]
      summary: One user's crew jobs, newest first (admin)
      description: |
        Without the brief's text and without the report. `withReport=1` adds each job's report.
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
        - name: withReport
          in: query
          required: false
          description: "`1` or `true` adds the report to each job."
          schema: { type: string, enum: ["0", "1", "false", "true"] }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminCrewJob" }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/crew-jobs/{crewJobId}/cancel:
    post:
      operationId: adminCancelCrewJob
      tags: [admin]
      summary: Cancel a crew job that has not started (admin)
      description: |
        Only a `queued` job: it is marked `failed` with the error "Cancelled by Textcrew support",
        it never runs, and the user is told in the job's chat. A running job can't be stopped
        midway (409): the crew job has no stop signal yet. A finished one is 409 too.
      parameters:
        - { name: crewJobId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500, description: "Why. Kept in the audit log, not shown to the user." }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCrewJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---------------------------------------------------------------- admin: accounts (role, suspend, delete, sign out, onboarding)
  # Every call here needs a `reason` and writes one activity-log row for the user with the admin's
  # id and that reason (the reason stays in the row's details; the user's own activity list shows
  # only a neutral summary). An admin can't act on their own account this way, and an admin must
  # lose the admin role before they can be suspended or deleted. Showing the welcome steps again
  # (`onboarding/reset`) is harmless, so it is allowed on any account, an admin's own too.
  /v1/admin/users/{userId}/role:
    put:
      operationId: adminSetUserRole
      tags: [admin]
      summary: Make a user an admin, or take the admin role away (admin)
      description: |
        The role lives in Clerk, in the user's public metadata (`role`). It is set there through
        Clerk's Backend API first, then on our own row at once, so it applies from the user's next
        request. Clerk's `user.updated` webhook that follows carries the same role. Setting the role
        a user already has changes nothing and writes nothing. An admin can't remove their own admin
        role (409). If Clerk can't be reached or isn't set up, nothing changes (503).
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, reason]
              additionalProperties: false
              properties:
                role: { type: string, enum: [user, admin] }
                reason: { type: string, minLength: 1, maxLength: 500, pattern: "\\S" }
      responses:
        "200":
          description: The account as it is now
          content:
            application/json:
              schema:
                type: object
                required: [account, changed]
                properties:
                  account:
                    type: object
                    required: [userId, role, status, suspendedAt]
                    properties:
                      userId: { type: string }
                      role: { type: string, enum: [user, admin] }
                      status: { type: string, enum: [active, suspended] }
                      suspendedAt: { type: [string, "null"], format: date-time }
                  changed: { type: boolean, description: False when the user already had this role. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503":
          description: Clerk could not be reached or is not set up (`CLERK_SECRET_KEY`). Nothing changed. Retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/admin/users/{userId}/suspend:
    post:
      operationId: adminSuspendUser
      tags: [admin]
      summary: Suspend an account (admin)
      description: |
        Puts the account on hold until it is unsuspended:
        - every signed-in call of the user answers 403 `account_suspended`, the live stream too;
        - the user's container may no longer call the platform's tools or the git gateway;
        - messages from the user's linked chats are saved but not answered; each chat gets at most
          one short notice a day saying the account is suspended;
        - the user's automations that are on, or paused for lack of credits, are paused with the
          reason `admin`;
        - the container is stopped politely through the vm-manager and is not woken again. A
          container in the middle of a turn is not stopped: the vm-manager refuses, the turn
          finishes, and the idle stop puts it to sleep 3 minutes later (`containerStopped: false`).
        Suspending a suspended account again changes nothing and writes no second log row, but it
        does try the pause and the stop again. Refused for your own account and for an admin (409).
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1, maxLength: 500, pattern: "\\S" }
      responses:
        "200":
          description: Suspended
          content:
            application/json:
              schema:
                type: object
                required: [account, changed, automationsPaused, containerStopped]
                properties:
                  account:
                    type: object
                    required: [userId, role, status, suspendedAt]
                    properties:
                      userId: { type: string }
                      role: { type: string, enum: [user, admin] }
                      status: { type: string, enum: [active, suspended] }
                      suspendedAt: { type: [string, "null"], format: date-time }
                  changed: { type: boolean, description: False when the account was suspended already. }
                  automationsPaused: { type: integer, description: Automations paused by this call. }
                  containerStopped:
                    type: boolean
                    description: |
                      True when the vm-manager stopped the container now (or there was none to stop).
                      False when it refused (a turn is running): the idle stop does it later.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/admin/users/{userId}/unsuspend:
    post:
      operationId: adminUnsuspendUser
      tags: [admin]
      summary: Lift a suspension (admin)
      description: |
        The account works again at once. The automations paused by the suspension come back: on,
        if the user has credits; otherwise paused for lack of credits, so they come back with the
        next credits like any other. The container wakes with the user's next message. Unsuspending
        an active account changes nothing and writes no log row.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1, maxLength: 500, pattern: "\\S" }
      responses:
        "200":
          description: Active again
          content:
            application/json:
              schema:
                type: object
                required: [account, changed, automationsResumed, automationsWaitingForCredits]
                properties:
                  account:
                    type: object
                    required: [userId, role, status, suspendedAt]
                    properties:
                      userId: { type: string }
                      role: { type: string, enum: [user, admin] }
                      status: { type: string, enum: [active, suspended] }
                      suspendedAt: { type: [string, "null"], format: date-time }
                  changed: { type: boolean, description: False when the account was active already. }
                  automationsResumed: { type: integer }
                  automationsWaitingForCredits:
                    type: integer
                    description: Paused for lack of credits instead, because the balance is zero.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/users/{userId}/sessions/revoke:
    post:
      operationId: adminRevokeUserSessions
      tags: [admin]
      summary: Sign a user out everywhere (admin)
      description: |
        Ends every active Clerk session of the user, through Clerk's Backend API. A session token
        the browser already holds is checked without asking Clerk, so it keeps working until it
        expires (Clerk's tokens last about a minute); after that the user must sign in again.
        Signing out does not suspend the account.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1, maxLength: 500, pattern: "\\S" }
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: integer, description: Sessions ended by this call. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Clerk could not be reached or is not set up (`CLERK_SECRET_KEY`). Retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/admin/users/{userId}/onboarding/reset:
    post:
      operationId: adminResetUserOnboarding
      tags: [admin]
      summary: Show a user the welcome steps and the "Getting started" checklist again (admin)
      description: |
        Clears the user's two first-run marks, `onboardingCompletedAt` and
        `gettingStartedDismissedAt` (see `Me`). The web app then shows the welcome steps on the
        user's next visit, and the "Getting started" checklist while any of its steps is left.
        Nothing else changes. Allowed on any account that is not deleted, an admin's own too. When
        both marks are already empty, nothing changes and no log row is written (`changed: false`).
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1, maxLength: 500, pattern: "\\S" }
      responses:
        "200":
          description: Both marks are empty now
          content:
            application/json:
              schema:
                type: object
                required: [userId, onboardingCompletedAt, gettingStartedDismissedAt, changed]
                properties:
                  userId: { type: string }
                  onboardingCompletedAt: { type: "null" }
                  gettingStartedDismissedAt: { type: "null" }
                  changed:
                    type: boolean
                    description: False when both marks were already empty.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/users/{userId}:
    get:
      operationId: adminGetUser
      tags: [admin]
      summary: One user's details (admin)
      description: |
        Counts and metadata only. Never the user's messages, memories, keys, tokens, app account
        names or the arguments of what the agent did: the activity entries are the one-line
        summaries the user sees in their own activity log.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: adminUpdateUser
      tags: [admin]
      summary: Set a user's plan by hand (admin)
      description: |
        The steps a paid change of plan takes, with no payment and no credits: the plan, the
        LiteLLM key's models and budget, Scout's browser switch (from the agent's next start) and
        the queue priority. The same plan again changes nothing. Written to the activity log with
        the admin's id. A Polar subscription that is still running can set its own plan again at
        its next event; `subscription` says whether there is one.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              additionalProperties: false
              properties:
                plan: { $ref: "#/components/schemas/PlanId" }
                reason:
                  type: string
                  maxLength: 200
                  description: Why, for the activity log.
      responses:
        "200":
          description: Done (or nothing to change)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPlanChange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: adminDeleteUser
      tags: [admin]
      summary: Delete an account (admin)
      description: |
        The same deletion a user's own goes through. The user is deleted in Clerk first (through
        Clerk's Backend API); then the account is marked deleted at once and the deletion job runs:
        the container and the user's folder (the vm-manager's `DeleteSandbox`), the LiteLLM key,
        app connections, automations, linked chats, conversations, messages, files and memories,
        and a renewing subscription is set to not renew. Clerk's `user.deleted` webhook that
        follows finds the account already deleted and adds nothing.

        `confirmEmail` must be the user's email (letter case and spaces around it don't matter),
        else 400 and nothing happens. Refused for your own account and for an admin (409). The log
        row keeps the admin's id, the deleted user's id and the reason; never the email or name.
        An account already deleted answers 404.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, confirmEmail]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1, maxLength: 500, pattern: "\\S" }
                confirmEmail: { type: string, maxLength: 320 }
      responses:
        "202":
          description: Deleted in Clerk and on our side; the deletion job removes the rest
          content:
            application/json:
              schema:
                type: object
                required: [userId, status]
                properties:
                  userId: { type: string }
                  status: { type: string, const: deleting }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503":
          description: Clerk could not be reached or is not set up (`CLERK_SECRET_KEY`). Nothing changed. Retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------------------------------------------------------------- webhooks (called by external services)
  /webhooks/clerk:
    post:
      operationId: webhookClerk
      tags: [webhooks]
      summary: Clerk events (user.created, user.deleted)
      security: []
      parameters:
        - { name: svix-id, in: header, required: true, schema: { type: string } }
        - { name: svix-timestamp, in: header, required: true, schema: { type: string } }
        - { name: svix-signature, in: header, required: true, schema: { type: string } }
      requestBody: { $ref: "#/components/requestBodies/RawWebhook" }
      responses:
        "200": { $ref: "#/components/responses/WebhookAccepted" }
        "401": { $ref: "#/components/responses/WebhookUnauthorized" }

  /webhooks/whatsapp:
    get:
      operationId: webhookWhatsappVerify
      tags: [webhooks]
      summary: Meta verification handshake
      description: Answers 403 while WhatsApp is switched off (`ENABLED_CHANNELS`).
      security: []
      parameters:
        - { name: hub.mode, in: query, required: true, schema: { type: string } }
        - { name: hub.verify_token, in: query, required: true, schema: { type: string } }
        - { name: hub.challenge, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Echo of hub.challenge
          content:
            text/plain:
              schema: { type: string }
        "403": { description: "Wrong verify token, or WhatsApp is switched off" }
    post:
      operationId: webhookWhatsapp
      tags: [webhooks]
      summary: WhatsApp messages, button replies and status updates
      description: While WhatsApp is switched off (`ENABLED_CHANNELS`) this answers 200 and saves nothing.
      security: []
      parameters:
        - { name: X-Hub-Signature-256, in: header, required: true, schema: { type: string } }
      requestBody: { $ref: "#/components/requestBodies/RawWebhook" }
      responses:
        "200": { $ref: "#/components/responses/WebhookAccepted" }
        "401": { $ref: "#/components/responses/WebhookUnauthorized" }

  /webhooks/telegram:
    post:
      operationId: webhookTelegram
      tags: [webhooks]
      summary: Telegram updates
      description: While Telegram is switched off (`ENABLED_CHANNELS`) this answers 200 and saves nothing.
      security: []
      parameters:
        - { name: X-Telegram-Bot-Api-Secret-Token, in: header, required: true, schema: { type: string } }
      requestBody: { $ref: "#/components/requestBodies/RawWebhook" }
      responses:
        "200": { $ref: "#/components/responses/WebhookAccepted" }
        "401": { $ref: "#/components/responses/WebhookUnauthorized" }

  /webhooks/sendblue:
    post:
      operationId: webhookSendblue
      tags: [webhooks]
      summary: iMessage events via Sendblue
      description: While iMessage is switched off (`ENABLED_CHANNELS`) this answers 200 and saves nothing.
      security: []
      parameters:
        - { name: sb-signing-secret, in: header, required: true, schema: { type: string } }
      requestBody: { $ref: "#/components/requestBodies/RawWebhook" }
      responses:
        "200": { $ref: "#/components/responses/WebhookAccepted" }
        "401": { $ref: "#/components/responses/WebhookUnauthorized" }

  /webhooks/polar:
    post:
      operationId: webhookPolar
      tags: [webhooks]
      summary: Polar order, subscription and refund events
      description: |
        Signed with Standard Webhooks (`webhook-id`, `webhook-timestamp`, `webhook-signature`).
        The event is saved once per `webhook-id`, then handled by the worker.
      security: []
      parameters:
        - { name: webhook-id, in: header, required: true, schema: { type: string } }
        - { name: webhook-timestamp, in: header, required: true, schema: { type: string } }
        - { name: webhook-signature, in: header, required: true, schema: { type: string } }
      requestBody: { $ref: "#/components/requestBodies/RawWebhook" }
      responses:
        "200": { $ref: "#/components/responses/WebhookAccepted" }
        "401": { $ref: "#/components/responses/WebhookUnauthorized" }

  /webhooks/composio:
    post:
      operationId: webhookComposio
      tags: [webhooks]
      summary: Composio connection status and app-event triggers
      security: []
      parameters:
        - { name: webhook-signature, in: header, required: true, schema: { type: string } }
      requestBody: { $ref: "#/components/requestBodies/RawWebhook" }
      responses:
        "200": { $ref: "#/components/responses/WebhookAccepted" }
        "401": { $ref: "#/components/responses/WebhookUnauthorized" }

components:
  securitySchemes:
    clerkAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk session token.

  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
    ChannelLinkId:
      name: channelLinkId
      in: path
      required: true
      schema: { type: string }
    McpServerId:
      name: mcpServerId
      in: path
      required: true
      schema: { type: string }
    AutomationId:
      name: automationId
      in: path
      required: true
      schema: { type: string }
    MemoryId:
      name: memoryId
      in: path
      required: true
      schema: { type: string }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, examples: [cnv_01jz3m8q4kd2v7x9w0t5b6c8ya] }
    Provider:
      name: provider
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ByokProvider" }
    RepoOwner:
      name: owner
      in: path
      required: true
      description: The GitHub user or organisation that owns the repo.
      schema: { type: string, pattern: "^[A-Za-z0-9_.-]{1,100}$", examples: [acme] }
    RepoName:
      name: repo
      in: path
      required: true
      description: The repo's name, without `.git`.
      schema: { type: string, pattern: "^[A-Za-z0-9_.-]{1,100}$", examples: [website] }

  requestBodies:
    RawWebhook:
      required: true
      description: Provider-defined JSON. The signature is checked on the raw body before parsing.
      content:
        application/json:
          schema: { type: object, additionalProperties: true }

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        Not allowed: `forbidden` (e.g. not an admin), or `account_suspended` (an admin suspended
        the account; every signed-in call answers this until it is unsuspended)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found (or not owned by this user)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The request can't be applied to this item as it is now
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    OutOfCredits:
      description: Balance is zero; upgrade, top up or redeem a coupon
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    WebhookAccepted:
      description: |
        Accepted (event saved and queued, or a duplicate ignored). A chat webhook whose channel is
        switched off also answers 200, with nothing saved.
    WebhookUnauthorized:
      description: Signature or secret invalid
    PlanLimit:
      description: The current plan doesn't allow this (e.g. app limit, own MCP servers, top-ups on Free)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ChannelDisabled:
      description: |
        `channel_disabled`: this channel is switched off for the deployment (it is not in
        `available`, see `GET /v1/channels`). `details.channel` names it.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }


  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [invalid_request, unauthorized, forbidden, account_suspended, not_found,
                         rate_limited, out_of_credits, plan_limit, channel_disabled,
                         invalid_or_expired_code, conflict, unavailable, internal]
            message: { type: string }
            details: { type: object, additionalProperties: true }

    PlanId:
      type: string
      enum: [free, pro, max]

    CheckoutPlanRequest:
      type: object
      required: [kind, planId]
      properties:
        kind: { type: string, const: plan }
        planId: { $ref: "#/components/schemas/PlanId" }

    CheckoutTopUpRequest:
      type: object
      required: [kind, topUpId]
      properties:
        kind: { type: string, const: topup }
        topUpId: { type: string }

    ChannelType:
      type: string
      enum: [whatsapp, telegram, imessage, web]

    Me:
      type: object
      required:
        - id
        - email
        - emailVerified
        - name
        - timezone
        - timezoneSet
        - plan
        - role
        - credits
        - createdAt
        - onboardingCompletedAt
        - gettingStartedDismissedAt
      properties:
        id: { type: string }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        name: { type: string }
        timezone: { type: string, examples: [Asia/Kolkata] }
        timezoneSet:
          type: boolean
          description: |
            False while the account still has the time zone it started with (`UTC`) and nobody has
            set one. The web app then sets it once, from the browser's time zone. True once a
            `PATCH /v1/me` with `timezone` was made (by the user, or by the web app that once), so
            a time zone someone set is never replaced.
        plan: { $ref: "#/components/schemas/PlanId" }
        role: { type: string, enum: [user, admin] }
        credits:
          type: object
          required: [balance]
          properties:
            balance: { type: integer }
            nextExpiry: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        onboardingCompletedAt:
          type: [string, "null"]
          format: date-time
          description: |
            When the user finished or skipped the web app's welcome steps. Null means not yet, so
            the web app shows them. Every account starts with null, and so did the accounts made
            before this field existed: they see the welcome steps once too. Set with
            `PATCH /v1/me` `onboardingCompleted: true`; cleared with `false` (to see them again,
            from Settings) or by an admin.
        gettingStartedDismissedAt:
          type: [string, "null"]
          format: date-time
          description: |
            When the user closed the "Getting started" checklist. Null means it may still show.
            The web app also hides it by itself once every step is done, worked out from the
            account's real data; the backend does not track the steps. Set with `PATCH /v1/me`
            `gettingStartedDismissed: true`; cleared with `false` or by an admin.

    MeUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 80 }
        timezone: { type: string }
        onboardingCompleted:
          type: boolean
          description: |
            `true`: the welcome steps are done (finished or skipped). Sets `onboardingCompletedAt`
            to now; if it is already set, the first time is kept. `false`: clears it, so the web
            app shows the welcome steps again.
        gettingStartedDismissed:
          type: boolean
          description: |
            `true`: the user closed the "Getting started" checklist. Sets
            `gettingStartedDismissedAt` to now; if it is already set, the first time is kept.
            `false`: clears it, so the checklist may show again.

    ChannelLink:
      type: object
      required: [id, channel, displayId, linkedAt]
      properties:
        id: { type: string }
        channel: { $ref: "#/components/schemas/ChannelType" }
        displayId:
          type: string
          description: Masked phone number or Telegram username
          examples: ["+91 •••• ••42 10"]
        linkedAt: { type: string, format: date-time }
        within24hWindow:
          type: boolean
          description: WhatsApp only; whether free-form replies are currently allowed.

    LinkCode:
      type: object
      required: [code, channel, expiresAt, instructions]
      properties:
        code: { type: string, examples: [LINK-4821-QX] }
        channel: { $ref: "#/components/schemas/ChannelType" }
        expiresAt: { type: string, format: date-time }
        instructions:
          type: string
          examples: ["Send LINK-4821-QX to +1 555 010 0000 on WhatsApp"]
        deepLink:
          type: [string, "null"]
          format: uri
          description: e.g. a wa.me or t.me link with the code pre-filled

    ConversationKind:
      type: string
      enum: [chat, automations]
      description: |
        `chat`: a conversation of a chat (web chat, or one Telegram chat). `automations`: the
        Automations chat, where every automation's runs answer (one per user, in web chat).

    Conversation:
      type: object
      description: One stretch of a chat between two "New chat" actions. The agent keeps a context of its own for each.
      required: [id, channel, kind, epoch, startedAt, lastMessageAt, title, active]
      properties:
        id: { type: string, examples: [cnv_01jz3m8q4kd2v7x9w0t5b6c8ya] }
        channel: { $ref: "#/components/schemas/ChannelType" }
        kind:
          $ref: "#/components/schemas/ConversationKind"
          description: |
            `automations` for the Automations chat: every run of every automation answers there
            (timers, app events, pull-request review verdicts, and the automations' notices), never
            in the conversation the user has open. It is titled "Automations", is a web
            conversation that is never the active one, keeps its name, cannot be deleted, and the
            agent keeps a context of its own for it. Older servers leave the field out: read that
            as `chat`.
        epoch:
          type: integer
          minimum: 0
          description: The conversation's number within its chat. It never changes and is never used again.
        startedAt: { type: string, format: date-time }
        lastMessageAt:
          type: string
          format: date-time
          description: When its newest message was saved; `startedAt` while it has none.
        title:
          type: string
          description: |
            The name the user gave it, else the first incoming message's text cut to 60 characters
            at a word, else "New chat" while it has no such message. "Automations" for the
            Automations chat.
          examples: [Plan a trip to Goa]
        active:
          type: boolean
          description: |
            True for the one conversation of its chat that the next message goes into. Web chat:
            the one the user has open to write in. Telegram: the chat's latest one. Always false
            for the Automations chat.

    ConversationDeleted:
      type: object
      description: The `data` of a `conversation.deleted` stream event.
      required: [id]
      additionalProperties: false
      properties:
        id: { type: string }

    MessageDraft:
      type: object
      description: |
        The `data` of a `message.draft` stream event: the answer the agent is writing in a turn
        whose answer goes to web chat, so far. Live only: it is never saved. See `GET /v1/stream`
        for how to show it.
      required: [conversationId, turnId, messageId, text, at]
      additionalProperties: false
      properties:
        conversationId:
          type: string
          description: The conversation of the turn, where the answer will be saved.
        turnId:
          type: string
          description: The same for every draft of one turn; another turn has another one.
        messageId:
          type: [string, "null"]
          description: |
            The incoming message the turn answers. Null when it answers none (the answer to an
            approval, an automation).
        text:
          type: string
          maxLength: 16000
          description: |
            The whole draft so far, as the agent writes it (it may be half-written Markdown). Empty:
            the agent started over, and nothing is being written right now.
          examples: ["Here are your meetings for today:\n\n- 10:00 Design review"]
        at: { type: string, format: date-time }

    Message:
      type: object
      required: [id, conversationId, channel, direction, text, status, createdAt]
      properties:
        id: { type: string }
        conversationId:
          type: string
          description: The conversation this message belongs to.
        channel: { $ref: "#/components/schemas/ChannelType" }
        direction: { type: string, enum: [in, out] }
        text:
          type: string
          description: |
            The message as it was written.

            An agent's message (`direction: out`) may contain Markdown: CommonMark plus tables.
            Clients render it as Markdown and never treat it as HTML. This holds on every
            channel: a reply to a chat app is sent there as plain text, and the message keeps
            the agent's original text.

            A user's message (`direction: in`) is plain text. Show it as typed.
        attachments:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              mimeType: { type: string }
        status: { type: string, enum: [queued, processing, sent, delivered, read, failed] }
        approvalId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    ApprovalStatus:
      type: string
      enum: [pending, approved, rejected, expired]

    Approval:
      type: object
      required: [id, status, summary, createdAt, expiresAt]
      properties:
        id: { type: string }
        status: { $ref: "#/components/schemas/ApprovalStatus" }
        summary: { type: string, examples: ["Send email to priya@acme.com: \"Report delayed to Monday\""] }
        app: { type: [string, "null"], examples: [gmail] }
        action: { type: [string, "null"], examples: [GMAIL_SEND_EMAIL] }
        details: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        decidedAt: { type: [string, "null"], format: date-time }

    App:
      type: object
      required: [slug, name, provider, description, category, availableOnPlan, connectable, connections]
      properties:
        slug: { type: string, examples: [gmail] }
        name: { type: string, examples: [Gmail] }
        provider:
          type: string
          description: The company whose sign-in screen the user sees when connecting ("Continue to Google").
          examples: [Google]
        description:
          type: string
          description: In plain words, what the agent can do with the app once it is connected. One sentence.
          examples: ["Read and search your email, write drafts and send email for you."]
        iconUrl: { type: [string, "null"], format: uri }
        category: { type: string, examples: [email, calendar, notes, tasks, crm, dev, research] }
        availableOnPlan: { type: boolean }
        connectable:
          type: boolean
          description: |
            True when this server can connect the app: it has a Composio setup for it, or may make
            one on the first connect (`COMPOSIO_MANAGED_APPS`). False: the app is listed but cannot
            be connected yet (`POST /v1/apps/{appSlug}/connect` answers 404 for it); show it as
            "Not available yet", without a Connect button.
        connections:
          type: array
          items:
            type: object
            required: [id, status]
            properties:
              id: { type: string }
              accountLabel: { type: [string, "null"], examples: [work@acme.com] }
              status: { type: string, enum: [active, expired, error] }

    McpServer:
      type: object
      required: [id, name, url, enabled, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string, format: uri }
        enabled: { type: boolean }
        hasSecret: { type: boolean }
        lastError: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    McpServerCreate:
      type: object
      required: [name, url]
      properties:
        name: { type: string, maxLength: 60 }
        url: { type: string, format: uri, description: Must be https }
        authHeaderName: { type: string, examples: [Authorization] }
        authSecret: { type: string, writeOnly: true }

    ByokProvider:
      type: string
      enum: [anthropic, openai, openrouter]

    ByokKey:
      type: object
      required: [provider, set, effectiveModel, inUse]
      properties:
        provider: { $ref: "#/components/schemas/ByokProvider" }
        set: { type: boolean }
        last4: { type: [string, "null"] }
        model:
          type: [string, "null"]
          description: The model the user chose (null = the provider's default)
        effectiveModel:
          type: string
          description: The model that runs with this key, the user's choice or the provider's default
        inUse:
          type: boolean
          description: |
            True when the agent's model calls go to this provider with this key right now. False
            when no key is set, when another source pays (Textcrew AI chosen, a Claude plan in
            charge, or a key saved later), or while the switch to this key is still pending.
        updatedAt: { type: [string, "null"], format: date-time }

    Automation:
      type: object
      required: [id, kind, title, instruction, enabled, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [once, repeat, event] }
        title: { type: string }
        instruction: { type: string }
        runAt: { type: [string, "null"], format: date-time, description: kind=once }
        cron: { type: [string, "null"], description: kind=repeat }
        timezone: { type: [string, "null"] }
        trigger:
          type: [object, "null"]
          description: kind=event
          properties:
            app: { type: string }
            event: { type: string }
        preset:
          type: [string, "null"]
          enum: [pr_review, null]
          description: "`pr_review`: this automation is pull-request review for one repo (see `/v1/pr-reviews`)."
        enabled: { type: boolean }
        pausedReason:
          type: [string, "null"]
          enum: [out_of_credits, failures, user, admin, suspended, null]
          description: "`admin`: paused by Textcrew support. Adding credits does not resume it; the user can. `suspended`: paused while an admin suspended the account; it comes back when the account is unsuspended."
        nextRunAt: { type: [string, "null"], format: date-time }
        lastRunAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    Memory:
      type: object
      description: One short fact the agent saved about the user (HLD 0.9).
      required: [id, kind, content, createdAt, updatedAt, lastUsedAt, useCount]
      properties:
        id: { type: string, examples: [mem_01jb2k3m4n5p6q7r8s9t0v1w2x] }
        kind:
          type: string
          enum: [preference, person, project, instruction, fact]
          description: "`instruction` is a standing instruction; `fact` is anything else that lasts."
        content:
          type: string
          maxLength: 300
          description: One line of plain text.
          examples: ["Prefers short replies with no emoji"]
        createdAt: { type: string, format: date-time }
        updatedAt:
          type: string
          format: date-time
          description: When the text last changed (the agent corrected it). Equal to `createdAt` if never.
        lastUsedAt:
          type: [string, "null"]
          format: date-time
          description: When the agent last found it with a search. Null if never.
        useCount: { type: integer, description: How many times the agent found it with a search. }

    PrReviewRepo:
      type: object
      required: [id, owner, repo, enabled, pausedReason, channel, lastReviewAt, createdAt]
      properties:
        id:
          type: string
          description: "The automation's id. Pause or resume it with `PATCH /v1/automations/{automationId}`."
        owner: { type: string, examples: [acme] }
        repo: { type: string, examples: [website] }
        enabled:
          type: boolean
          description: False while paused. A paused repo gets no reviews and gives no standing approval.
        pausedReason:
          type: [string, "null"]
          enum: [out_of_credits, failures, user, admin, suspended, null]
          description: "`admin`: paused by Textcrew support. Adding credits does not resume it; the user can. `suspended`: paused while an admin suspended the account; it comes back when the account is unsuspended."
        channel:
          $ref: "#/components/schemas/ChannelType"
          description: |
            `telegram`: a copy of each verdict is also sent to the user's Telegram chat. The
            verdict itself is always in the Automations chat.
        lastReviewAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    GithubRepo:
      type: object
      required: [owner, name, fullName, private, defaultBranch, pushedAt]
      properties:
        owner: { type: string, examples: [acme] }
        name: { type: string, examples: [website] }
        fullName: { type: string, examples: [acme/website] }
        private: { type: boolean }
        defaultBranch: { type: [string, "null"], examples: [main] }
        pushedAt: { type: [string, "null"], format: date-time }

    CrewJobFocus:
      type: string
      enum: [bugs, security, tests, performance, style]

    CrewJobReportTo:
      type: object
      description: What to do with the final report.
      properties:
        channel:
          type: string
          enum: [web, telegram]
          default: web
          description: |
            The chat the report is sent to (always). `web`: a web conversation of the job's own,
            named after it. `telegram`: the user's linked Telegram chat (400 when there is none).
        pullRequest:
          type: boolean
          default: false
          description: |
            Patch: post the report on the pull request (`pullNumber`) as ONE review of type
            comment. Byte: put it in the description of the pull request it opens (needs
            `finish: pull_request`).
        issue:
          type: boolean
          default: false
          description: Open one issue in the repository with the report.

    CrewJobInput:
      type: object
      required: [member, owner, repo, clientRequestId]
      properties:
        member:
          type: string
          enum: [patch, byte]
          description: "`patch` reviews (it never changes code); `byte` changes code on a new branch."
        owner: { type: string, pattern: "^[A-Za-z0-9_.-]{1,100}$", examples: [acme] }
        repo: { type: string, pattern: "^[A-Za-z0-9_.-]{1,100}$", examples: [website] }
        pullNumber:
          type: [integer, "null"]
          minimum: 1
          maximum: 999999999
          description: |
            Patch: the pull request to review. Byte: a pull request to start from (its branch).
        branch:
          type: [string, "null"]
          maxLength: 200
          description: |
            Patch: the branch to review against the default branch, when there is no pull request.
            Byte: the branch to start from (left out: the default branch). Letters, digits and
            `. _ - /` only.
        instructions:
          type: string
          maxLength: 4000
          description: |
            The user's own words. Patch: anything to look at or know. Byte: what to fix or build
            (required for Byte).
        focus:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/CrewJobFocus" }
          description: "Patch only: what to look for. Left out or empty: bugs, security and tests."
        acceptance:
          type: string
          maxLength: 2000
          description: "Byte only: what to test for, the checks that say the job is done."
        commands:
          type: string
          maxLength: 2000
          description: The commands to install, run the tests or start the app, if needed.
        finish:
          type: string
          enum: [pull_request, branch]
          default: pull_request
          description: "Byte only: push a branch and open a pull request, or only push the branch."
        reportTo: { $ref: "#/components/schemas/CrewJobReportTo" }
        clientRequestId:
          type: string
          format: uuid
          description: Idempotency key; sending it again returns the same job.

    CrewJob:
      type: object
      required:
        [id, member, status, title, owner, repo, pullNumber, branch, instructions, focus, acceptance,
         commands, finish, reportTo, source, report, error, conversationId, createdAt, startedAt,
         finishedAt]
      properties:
        id: { type: string, examples: [crj_01jb2k3m4n5p6q7r8s9t0v1w2x] }
        member: { type: string, enum: [patch, byte] }
        status:
          type: string
          enum: [queued, running, done, failed]
          description: |
            `queued` until the agent is free, `running` during its turn, then `done` (with the
            report) or `failed` (with `error`).
        title: { type: string, examples: ["Review acme/website#42", "Fix the login redirect in acme/website"] }
        owner: { type: string }
        repo: { type: string }
        pullNumber: { type: [integer, "null"] }
        branch: { type: [string, "null"] }
        instructions: { type: string }
        focus:
          type: array
          items: { $ref: "#/components/schemas/CrewJobFocus" }
          description: Patch's focus (empty for Byte).
        acceptance: { type: string }
        commands: { type: string }
        finish: { type: [string, "null"], enum: [pull_request, branch, null], description: Byte only. }
        reportTo:
          type: object
          required: [channel, pullRequest, issue]
          properties:
            channel: { $ref: "#/components/schemas/ChannelType" }
            pullRequest: { type: boolean }
            issue: { type: boolean }
        source:
          type: string
          enum: [app, chat]
          description: "`app`: given in the web app. `chat`: the lead started it from a chat message."
        report:
          type: [string, "null"]
          description: The final report as the agent wrote it (Markdown). Null until the job is done.
        error:
          type: [string, "null"]
          description: Why a failed job failed, in plain words.
        conversationId:
          type: [string, "null"]
          description: The web conversation the report was sent to, once known.
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }

    CrewMember:
      type: object
      required: [id, name, kind, role, description, available, browser]
      properties:
        id: { type: string, enum: [tex, byte, patch, scout] }
        name: { type: string, examples: [Tex, Byte, Patch, Scout] }
        kind: { type: string, enum: [lead, specialist] }
        role: { type: string, examples: [Lead, Coding, Code review, Research] }
        description: { type: string }
        available:
          type: boolean
          description: Whether this member works on this deployment yet.
        browser:
          type: [object, "null"]
          description: |
            Scout only. The real browser Scout can drive. It runs inside the user's own container
            and costs 2 credits per minute of browser time.
          required: [requiresPlan, available, enabled]
          properties:
            requiresPlan: { $ref: "#/components/schemas/PlanId" }
            available:
              type: boolean
              description: |
                Whether this deployment has the browser (the server setting `BROWSER_AVAILABLE`).
                The same for every user, and not the same as being on the plan. False: don't
                offer a browser to anyone yet.
            enabled:
              type: boolean
              description: |
                Whether the browser is switched on for the signed-in user: the deployment has it
                and the user's plan includes it. After a change of plan, the user's agent has it
                (or loses it) from its next start.

    AgentProgress:
      type: object
      required: [text, crew, at]
      properties:
        text: { type: string, examples: ["Scout: reading 4 pages", "using web_search"] }
        crew:
          type: [string, "null"]
          enum: [byte, patch, scout, null]
          description: The specialist the line names, when it names one.
        at: { type: string, format: date-time }

    AgentStatus:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [none, stopped, waking, awake, busy, broken] }
        lastActiveAt: { type: [string, "null"], format: date-time }

    Plan:
      type: object
      required: [id, name, priceCents, interval, monthlyCredits, signupCredits, limits, features]
      properties:
        id: { $ref: "#/components/schemas/PlanId" }
        name: { type: string }
        priceCents: { type: integer, examples: [0, 1200, 3000] }
        interval: { type: [string, "null"], enum: [month, null] }
        monthlyCredits: { type: integer, examples: [0, 1500, 4500] }
        signupCredits: { type: integer, examples: [100, 0, 0] }
        limits:
          type: object
          required: [apps, automations, ownMcpServers, topUps, models, browser]
          properties:
            apps: { type: integer }
            automations: { type: integer }
            ownMcpServers: { type: boolean }
            topUps: { type: boolean }
            models: { type: string, enum: [cheap, all] }
            browser:
              type: boolean
              description: Browser use is part of this plan (Max only).
        features:
          type: array
          description: |
            Lines for the pricing page. Max names Scout's web search (1 credit per search) and
            browser use (2 credits per minute); Free and Pro name neither.
          items: { type: string }

    TopUpPack:
      type: object
      required: [id, priceCents, credits, expiresInDays]
      properties:
        id: { type: string, examples: [topup_10] }
        priceCents: { type: integer, examples: [1000] }
        credits: { type: integer, examples: [800] }
        expiresInDays: { type: integer, examples: [90] }

    Subscription:
      type: object
      required: [plan, status]
      properties:
        plan: { $ref: "#/components/schemas/PlanId" }
        status: { type: string, enum: [none, active, cancel_at_period_end, past_due, cancelled] }
        currentPeriodStart: { type: [string, "null"], format: date-time }
        currentPeriodEnd: { type: [string, "null"], format: date-time }

    GrantSource:
      type: string
      enum: [signup, coupon, monthly, topup, admin, refund]

    CreditGrant:
      type: object
      required: [id, source, amount, remaining, cheapModelOnly, createdAt]
      properties:
        id: { type: string }
        source: { $ref: "#/components/schemas/GrantSource" }
        amount: { type: integer }
        remaining: { type: integer }
        expiresAt: { type: [string, "null"], format: date-time }
        cheapModelOnly: { type: boolean }
        createdAt: { type: string, format: date-time }

    CreditBalance:
      type: object
      required: [balance, grants]
      properties:
        balance: { type: integer, description: Sum of remaining unexpired grants (may be slightly negative after an overrun) }
        grants:
          type: array
          items: { $ref: "#/components/schemas/CreditGrant" }

    LedgerEntry:
      type: object
      required: [id, delta, reason, createdAt]
      properties:
        id: { type: string }
        delta: { type: integer }
        reason: { type: string, enum: [grant, charge, expire, refund, adjust, reversal] }
        grantId: { type: [string, "null"] }
        description: { type: string, examples: ["Usage: AI 3, awake time 1", "App action: GMAIL_SEND_EMAIL", "Web search"] }
        createdAt: { type: string, format: date-time }

    UsagePeriod:
      type: object
      required: [periodStart, periodEnd, aiCredits, awakeCredits, appActionCredits, browserCredits, toolCredits, totalCredits]
      properties:
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        aiCredits: { type: integer }
        awakeSeconds: { type: integer }
        awakeCredits: { type: integer }
        appActionCredits:
          type: integer
          description: |
            Credits for app actions that changed something in this period (1 credit per successful
            send, create, update or delete; reading and searching are free).
        browserSeconds:
          type: integer
          description: Seconds Scout's browser was in use in this period.
        browserCredits:
          type: integer
          description: |
            Browser time, at 2 credits per minute (1 credit per 30 seconds). Part minutes carry
            over to the next period, so this can be 0 for a period with a few browser seconds.
        toolCredits:
          type: integer
          description: |
            Paid tools. Today that is Scout's web search through Textcrew: 1 credit per search,
            Max plan only. Browser time is not in here: it has its own number, `browserCredits`.
        totalCredits:
          type: integer
          description: aiCredits + awakeCredits + appActionCredits + browserCredits + toolCredits

    UsageTotals:
      type: object
      required: [aiCredits, awakeCredits, appActionCredits, browserCredits, toolCredits, totalCredits]
      properties:
        aiCredits: { type: integer }
        awakeCredits: { type: integer }
        appActionCredits: { type: integer }
        browserCredits: { type: integer }
        toolCredits: { type: integer }
        totalCredits: { type: integer }

    CouponRedemption:
      type: object
      required: [creditsAdded, expiresAt, cheapModelOnly, balance]
      properties:
        creditsAdded: { type: integer, examples: [200] }
        expiresAt: { type: [string, "null"], format: date-time }
        cheapModelOnly: { type: boolean }
        balance: { type: integer }

    Coupon:
      type: object
      required: [id, campaign, codePrefix, credits, maxRedemptions, redeemedCount, active, createdAt]
      properties:
        id: { type: string }
        campaign: { type: string }
        codePrefix: { type: string, examples: ["AGT-7K…"] }
        credits: { type: integer }
        maxRedemptions: { type: integer }
        redeemedCount: { type: integer }
        expiresAt: { type: [string, "null"], format: date-time }
        creditExpiryDays: { type: integer, default: 90 }
        cheapModelOnly: { type: boolean, default: true }
        newUsersOnly: { type: boolean, default: false }
        plans:
          type: array
          items: { $ref: "#/components/schemas/PlanId" }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }

    CouponCreate:
      type: object
      required: [campaign, credits, maxRedemptions, expiresAt]
      properties:
        campaign: { type: string, maxLength: 80 }
        credits: { type: integer, minimum: 1, maximum: 10000 }
        maxRedemptions: { type: integer, minimum: 1 }
        codeCount:
          type: integer
          minimum: 1
          maximum: 500
          default: 1
          description: 1 = one shared code; more = that many single-use codes.
        expiresAt: { type: string, format: date-time }
        creditExpiryDays: { type: integer, minimum: 1, maximum: 365, default: 90 }
        cheapModelOnly: { type: boolean, default: true }
        newUsersOnly: { type: boolean, default: false }
        plans:
          type: array
          items: { $ref: "#/components/schemas/PlanId" }

    WaitlistStatus:
      type: string
      enum: [pending, invited, rejected]

    WaitlistJoin:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        name: { type: string, maxLength: 80 }
        referralSource: { type: string, maxLength: 100, description: "How they heard about us" }
        useCase: { type: string, maxLength: 500 }
        utm:
          type: object
          additionalProperties: false
          properties:
            source: { type: string, maxLength: 100 }
            medium: { type: string, maxLength: 100 }
            campaign: { type: string, maxLength: 100 }
            term: { type: string, maxLength: 100 }
            content: { type: string, maxLength: 100 }
        website:
          type: string
          maxLength: 200
          description: Honeypot. The form hides this field; humans leave it empty.

    WaitlistJoined:
      type: object
      required: [status, message]
      properties:
        status: { type: string, enum: [ok] }
        message: { type: string, examples: ["You're on the list. We'll email you when it's your turn."] }

    WaitlistEntry:
      type: object
      required: [id, email, status, flagged, flagReasons, ip, submitCount, createdAt, lastSeenAt]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: [string, "null"] }
        referralSource: { type: [string, "null"] }
        useCase: { type: [string, "null"] }
        utm: { type: [object, "null"], additionalProperties: { type: string } }
        status: { $ref: "#/components/schemas/WaitlistStatus" }
        flagged: { type: boolean }
        flagReasons:
          type: array
          items: { type: string, enum: [disposable_email, ip_burst, email_alias, manual] }
        ip: { type: string }
        forwardedFor: { type: [string, "null"], description: "Raw X-Forwarded-For chain" }
        userAgent: { type: [string, "null"] }
        acceptLanguage: { type: [string, "null"] }
        referer: { type: [string, "null"] }
        origin: { type: [string, "null"] }
        submitCount: { type: integer, description: "Times this email was submitted" }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }

    WaitlistStats:
      type: object
      required: [total, pending, invited, rejected, flagged, last24h, attemptsLast24h, blockedLast24h, topIps]
      properties:
        total: { type: integer }
        pending: { type: integer }
        invited: { type: integer }
        rejected: { type: integer }
        flagged: { type: integer }
        last24h: { type: integer }
        attemptsLast24h: { type: integer, description: "Every submission, including rejected ones" }
        blockedLast24h: { type: integer, description: "Honeypot hits and rate-limited attempts" }
        topIps:
          type: array
          description: IPs with more than one entry or attempt in the last 7 days, busiest first
          items:
            type: object
            required: [ip, entries, attempts, lastAt]
            properties:
              ip: { type: string }
              entries: { type: integer }
              attempts: { type: integer }
              lastAt: { type: string, format: date-time }

    # ---- admin: one user's apps, chats and automations
    AdminAppSetupSource:
      type: string
      enum: [settings, server_made, none]
      description: |
        Where this server's Composio setup for the app comes from. `settings`: named in
        `COMPOSIO_AUTH_CONFIGS` (our own sign-in app, usually). `server_made`: made by the server
        itself and kept in its table. `none`: no setup yet; with `connectable` true the server
        makes one on the first connect (`COMPOSIO_MANAGED_APPS`).

    AdminUserApp:
      type: object
      required: [id, app, appName, status, accountLabel, setupSource, connectable, connectedAt, lastCheckedAt]
      properties:
        id: { type: string, description: The connection's id }
        app: { type: string, examples: [gmail] }
        appName: { type: string, examples: [Gmail] }
        status: { type: string, enum: [pending, active, expired, error] }
        accountLabel: { type: [string, "null"], examples: [work@acme.com] }
        setupSource: { $ref: "#/components/schemas/AdminAppSetupSource" }
        connectable: { type: boolean, description: The app can be connected on this server today }
        connectedAt:
          type: string
          format: date-time
          description: When the user started connecting it (the connect link was made)
        lastCheckedAt:
          type: [string, "null"]
          format: date-time
          description: |
            When the platform last heard from Composio about this connection (a check, the app
            list, Composio's webhook or an admin's recheck). Null if never.

    AdminRecheckResult:
      type: object
      required: [connection, composioStatus, checksQueued]
      properties:
        connection: { $ref: "#/components/schemas/AdminUserApp" }
        composioStatus:
          type: [string, "null"]
          description: What Composio said, e.g. ACTIVE, INITIATED, EXPIRED, FAILED. Null when it has no such account.
          examples: [ACTIVE]
        checksQueued:
          type: boolean
          description: The connection is still being set up, and a fresh series of checks was queued.

    AdminUserChannel:
      type: object
      required: [id, channel, label, maskedChatId, linkedAt, enabled, blocked, lastInboundAt]
      properties:
        id: { type: string, description: The link's id }
        channel: { $ref: "#/components/schemas/ChannelType" }
        label:
          type: string
          description: What the user sees in Settings → Channels (a Telegram name or a masked number).
          examples: ["@rahul", "+91 •••• ••42 10"]
        maskedChatId:
          type: string
          description: The chat id or phone number, masked. The full id is never returned.
          examples: ["•••• 6789", "+91 •••• ••42 10"]
        linkedAt: { type: string, format: date-time }
        enabled:
          type: boolean
          description: The channel is switched on on this server (`ENABLED_CHANNELS`).
        blocked: { type: boolean, description: The user blocked the bot; nothing is sent there. }
        lastInboundAt: { type: [string, "null"], format: date-time }

    AdminUserAutomation:
      type: object
      required: [id, userId, title, kind, runAt, cron, trigger, repo, timezone, enabled, pausedReason, failCount, lastRunAt, nextRunAt, preset, completedAt, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        title: { type: string }
        kind: { type: string, enum: [once, repeat, event] }
        runAt: { type: [string, "null"], format: date-time, description: kind=once }
        cron: { type: [string, "null"], description: kind=repeat }
        trigger:
          type: [object, "null"]
          description: kind=event. The trigger's settings are left out.
          required: [app, event]
          properties:
            app: { type: string }
            event: { type: string }
        repo:
          type: [string, "null"]
          description: Pull-request review only, the repo it watches.
          examples: [acme/website]
        timezone: { type: [string, "null"] }
        enabled: { type: boolean }
        pausedReason: { type: [string, "null"], enum: [out_of_credits, failures, user, admin, suspended, null] }
        failCount: { type: integer, description: Failed runs in a row. Three pause it. }
        lastRunAt: { type: [string, "null"], format: date-time }
        nextRunAt: { type: [string, "null"], format: date-time }
        preset: { type: [string, "null"], enum: [pr_review, null] }
        completedAt:
          type: [string, "null"]
          format: date-time
          description: A one-time reminder that already ran. Not in the user's own list.
        createdAt: { type: string, format: date-time }

    AdminAppSummary:
      type: object
      required: [app, name, setupSource, connectable, users, active, pending, expired, failed]
      properties:
        app: { type: string, examples: [gmail] }
        name: { type: string, examples: [Gmail] }
        setupSource: { $ref: "#/components/schemas/AdminAppSetupSource" }
        connectable: { type: boolean, description: The app can be connected on this server today }
        users: { type: integer, description: "Users with at least one connection of this app, in any state" }
        active: { type: integer, description: Connections that work }
        pending: { type: integer, description: Connections started and not finished }
        expired: { type: integer, description: Connections whose sign-in expired }
        failed: { type: integer, description: Connections that failed (status `error`) }

    # ---- admin: one user's agent and container (no tokens, secrets or keys in any of these)
    AdminContainer:
      type: object
      description: |
        The user's container as the vm-manager reports it. Never its token or its Bridge secret.
        The vm-manager does not report when the container woke, so there is no "awake since".
      required: [reachable, state, busy, lastActiveAt, imageVersion, memoryBytes, engine, claudeSignedIn, browserOn]
      properties:
        reachable:
          type: boolean
          description: False when the vm-manager could not be asked. The other fields are then null, and `state` is `unknown`.
        state: { type: string, enum: [none, stopped, waking, awake, busy, broken, unknown] }
        busy: { type: [boolean, "null"], description: In the middle of a turn. }
        lastActiveAt:
          type: [string, "null"]
          format: date-time
          description: The last delivered message, tool call or git call.
        imageVersion: { type: [string, "null"], description: The agent image the container was made from. }
        memoryBytes: { type: [integer, "null"], description: "Memory in use, while it runs." }
        engine:
          type: [string, "null"]
          enum: [hermes, claude_code, null]
          description: The engine the vm-manager has on record for the container.
        claudeSignedIn:
          type: [boolean, "null"]
          description: Claude Code has its sign-in in the user's folder, as the vm-manager last saw it. Never the sign-in itself.
        browserOn:
          type: [boolean, "null"]
          description: Scout's browser as the vm-manager has it on record (a running container gets a change at its next wake).

    AdminAgent:
      type: object
      required: [userId, plan, container, engine, claude, claudeModel, claudeEffort, browser, ai, today]
      properties:
        userId: { type: string }
        plan: { $ref: "#/components/schemas/PlanId" }
        container: { $ref: "#/components/schemas/AdminContainer" }
        engine:
          type: object
          required: [chosen, effective]
          properties:
            chosen: { $ref: "#/components/schemas/AgentRuntime" }
            effective:
              type: [string, "null"]
              enum: [hermes, claude_code, null]
              description: What runs (null when the user has no AI source).
        claude:
          type: object
          required: [connected, connectedAt]
          properties:
            connected: { type: boolean }
            connectedAt: { type: [string, "null"], format: date-time }
        claudeModel: { type: [string, "null"], description: "Null: Default (Claude Code's own choice)." }
        claudeEffort:
          type: [string, "null"]
          enum: [low, medium, high, xhigh, max, null]
          description: "Null: Default (Claude Code's own choice)."
        browser:
          type: object
          required: [available, wanted, onRecord]
          properties:
            available: { type: boolean, description: This deployment has the browser (`BROWSER_AVAILABLE`). }
            wanted: { type: boolean, description: The deployment has it and the user's plan includes it. }
            onRecord: { type: [boolean, "null"], description: What the vm-manager has on record (null without a container or when it can't be asked). }
        ai:
          type: object
          required: [access, preference, serverMode, ownKeyProviders]
          properties:
            access:
              type: string
              enum: [claude_plan, own_key, platform, none]
              description: What pays for the AI now (`platform` is Textcrew AI, paid in credits).
            preference: { $ref: "#/components/schemas/AiPreference" }
            serverMode:
              type: string
              enum: [platform, own_only]
              description: The server's `AI_ACCESS_MODE`.
            ownKeyProviders:
              type: array
              items: { $ref: "#/components/schemas/ByokProvider" }
              description: The providers the user saved a key for. Never the key.
        today:
          type: object
          description: |
            Usage charged since midnight UTC, from the 5-minute usage syncs (the last few minutes
            may not be in it yet).
          required: [since, awakeSeconds, browserSeconds, creditsCharged]
          properties:
            since: { type: string, format: date-time }
            awakeSeconds: { type: integer }
            browserSeconds: { type: integer }
            creditsCharged: { type: integer, description: "AI, awake time and browser time charged by those syncs." }

    AdminApproval:
      type: object
      description: An approval without the action's inputs.
      required: [id, userId, status, summary, app, action, createdAt, expiresAt, decidedAt, decidedVia, used]
      properties:
        id: { type: string }
        userId: { type: string }
        status: { $ref: "#/components/schemas/ApprovalStatus" }
        summary: { type: string, description: The short summary the user was shown. }
        app: { type: [string, "null"], examples: [gmail] }
        action: { type: [string, "null"], examples: [GMAIL_SEND_EMAIL] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        decidedAt: { type: [string, "null"], format: date-time }
        decidedVia:
          type: [string, "null"]
          description: How it was answered (`web`, `telegram:button`, ...), or `admin` when support cancelled it.
        used: { type: boolean, description: An approved action already ran with it. }

    AdminCrewJob:
      type: object
      description: A crew job without the brief's text. `report` only with `withReport=1`.
      required: [id, userId, member, status, source, owner, repo, pullNumber, branch, reportTo, postedOnPullRequest, hasReport, error, createdAt, startedAt, finishedAt]
      properties:
        id: { type: string }
        userId: { type: string }
        member: { type: string, enum: [patch, byte] }
        status: { type: string, enum: [queued, running, done, failed] }
        source: { type: string, enum: [app, chat] }
        owner: { type: string }
        repo: { type: string }
        pullNumber: { type: [integer, "null"] }
        branch: { type: [string, "null"] }
        reportTo:
          type: object
          required: [channel, pullRequest, issue]
          properties:
            channel: { $ref: "#/components/schemas/ChannelType" }
            pullRequest: { type: boolean }
            issue: { type: boolean }
        postedOnPullRequest: { type: boolean, description: The one review the brief allowed was posted. }
        hasReport: { type: boolean }
        report: { type: [string, "null"], description: Only with `withReport=1`. }
        error: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }

    AdminOverview:
      type: object
      required: [generatedAt, users, plans, turns, containers, credits, approvals, jobs, waitlist]
      properties:
        generatedAt: { type: string, format: date-time }
        users:
          type: object
          required: [total, newToday, new7d, active7d, deleted]
          properties:
            total: { type: integer, description: "Accounts that are not deleted" }
            newToday: { type: integer }
            new7d: { type: integer }
            active7d: { type: integer, description: "Accounts that sent a message in the last 7 days, on any channel" }
            deleted: { type: integer }
        plans:
          type: object
          description: Accounts that are not deleted, by plan.
          required: [free, pro, max]
          properties:
            free: { type: integer }
            pro: { type: integer }
            max: { type: integer }
        turns:
          type: object
          required: [today, last7d, failedToday, failed7d]
          properties:
            today: { type: integer }
            last7d: { type: integer }
            failedToday: { type: integer, description: "Turns that ended in an error or failed" }
            failed7d: { type: integer }
        containers:
          type: object
          required: [awake]
          properties:
            awake:
              type: [integer, "null"]
              description: Containers waking, awake or busy right now. Null when the vm-manager can't be asked.
        credits:
          type: object
          required: [month, granted, spent]
          properties:
            month: { type: string, examples: ["2026-10"] }
            granted: { type: integer, description: "Credits granted this month (UTC), every source" }
            spent: { type: integer, description: "Credits charged this month, less charges given back" }
        approvals:
          type: object
          required: [open]
          properties:
            open: { type: integer, description: "Approvals waiting for an answer, not expired" }
        jobs:
          type: object
          required: [failed]
          properties:
            failed:
              type: [integer, "null"]
              description: Failed jobs in the four queues (kept 30 days). Null when the queues can't be read.
        waitlist:
          type: object
          required: [total, pending]
          properties:
            total: { type: integer }
            pending: { type: integer }

    AdminUser:
      type: object
      required: [id, email, emailVerified, name, timezone, plan, role, status, suspendedAt, flagged, createdAt, deletedAt, lastActiveAt, credits, engine, channels, connectedApps]
      properties:
        id: { type: string }
        email: { type: string }
        emailVerified: { type: boolean }
        name: { type: string }
        timezone: { type: string }
        plan: { $ref: "#/components/schemas/PlanId" }
        role: { type: string, enum: [user, admin] }
        status:
          type: string
          enum: [active, suspended, deleted]
          description: "`deleted` when the account was deleted, else the account's own status."
        suspendedAt: { type: [string, "null"], format: date-time, description: "When the current suspension started" }
        flagged: { type: boolean, description: "Marked after a chargeback" }
        createdAt: { type: string, format: date-time }
        deletedAt: { type: [string, "null"], format: date-time }
        lastActiveAt:
          type: [string, "null"]
          format: date-time
          description: When the user last sent a message, on any channel (messages are kept 365 days).
        credits: { type: integer, description: "The balance, worked out from the grants" }
        engine: { $ref: "#/components/schemas/AgentRuntime" }
        channels:
          type: array
          description: The chat apps linked (the kinds only, never a chat id or number).
          items: { type: string, enum: [whatsapp, telegram, imessage] }
        connectedApps: { type: integer, description: "App connections that are active" }

    AdminUserDetailApp:
      type: object
      required: [app, name, status, connectedAt]
      properties:
        app: { type: string, examples: [gmail] }
        name: { type: string, examples: [Gmail] }
        status: { type: string, enum: [pending, active, expired, error] }
        connectedAt: { type: string, format: date-time }

    AdminUserDetailAutomation:
      type: object
      required: [id, title, kind, preset, enabled, pausedReason, nextRunAt, lastRunAt, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        kind: { type: string, enum: [once, repeat, event] }
        preset: { type: [string, "null"], enum: [pr_review, null] }
        enabled: { type: boolean }
        pausedReason: { type: [string, "null"], enum: [out_of_credits, failures, user, admin, suspended, null] }
        nextRunAt: { type: [string, "null"], format: date-time }
        lastRunAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    AdminUserDetailCrewJob:
      type: object
      required: [id, member, status, source, repo, createdAt, finishedAt]
      properties:
        id: { type: string }
        member: { type: string, enum: [patch, byte] }
        status: { type: string, enum: [queued, running, done, failed] }
        source: { type: string, enum: [app, chat] }
        repo: { type: string, examples: [acme/website] }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }

    AdminTurnTiming:
      type: object
      description: Where one turn's time went. Stage names and milliseconds only, never any text.
      required: [id, startedAt, kind, channel, route, engine, wake, outcome, attempt, answeredMs, stages]
      properties:
        id: { type: string, description: "The turn's delivery id" }
        startedAt: { type: string, format: date-time }
        kind: { type: string }
        channel: { type: string }
        route: { type: [string, "null"], examples: [task, simple] }
        engine: { type: [string, "null"], enum: [hermes, claude_code, null] }
        wake: { type: [string, "null"], examples: [warm, cold, capacity, recreated] }
        outcome: { type: string, examples: [done, simple, error, failed, retry] }
        attempt: { type: integer }
        answeredMs:
          type: [integer, "null"]
          description: How long after the message was queued the user had the answer.
        stages:
          type: array
          items:
            type: object
            required: [name, ms]
            properties:
              name: { type: string, examples: [queue, route, wake, work] }
              ms: { type: integer }

    AdminRouteTimes:
      type: object
      description: |
        Response times of one route (or of every request, in `overall`) over the window, in
        milliseconds. All zero when no request was counted.
      required: [route, count, clientErrors, serverErrors, p50Ms, p95Ms, p99Ms, maxMs]
      properties:
        route:
          type: string
          description: Method and route pattern; `all` in `overall`
          examples: ["GET /v1/conversations", "POST /mcp", "GET (no route)", all]
        count: { type: integer, description: Requests counted }
        clientErrors: { type: integer, description: Answers with a 4xx status }
        serverErrors: { type: integer, description: Answers with a 5xx status }
        p50Ms: { type: integer, description: Half the requests took at most this }
        p95Ms: { type: integer }
        p99Ms: { type: integer }
        maxMs: { type: integer, description: "The slowest request (exact)" }

    AdminActivityEntry:
      type: object
      required: [id, actor, action, summary, creditsCharged, createdAt]
      properties:
        id: { type: string }
        actor: { type: string, enum: [user, agent, admin, system] }
        action: { type: string }
        summary: { type: string }
        creditsCharged: { type: [integer, "null"] }
        createdAt: { type: string, format: date-time }

    AdminUserDetail:
      type: object
      required: [user, subscription, credits, ledger, apps, automations, crewJobs, turns, activity, agent, container]
      properties:
        user: { $ref: "#/components/schemas/AdminUser" }
        subscription:
          $ref: "#/components/schemas/Subscription"
          description: |
            The Polar subscription, with its own plan when there is one (a plan set by hand can
            differ from it); `status: none` and the user's plan when there is none.
        credits: { $ref: "#/components/schemas/CreditBalance" }
        ledger:
          type: array
          description: The last 20 changes to the user's credits, newest first.
          items: { $ref: "#/components/schemas/LedgerEntry" }
        apps:
          type: array
          items: { $ref: "#/components/schemas/AdminUserDetailApp" }
        automations:
          type: array
          description: Automations that are not finished, newest first.
          items: { $ref: "#/components/schemas/AdminUserDetailAutomation" }
        crewJobs:
          type: array
          description: The last 20 crew jobs, newest first.
          items: { $ref: "#/components/schemas/AdminUserDetailCrewJob" }
        turns:
          type: array
          description: The last 20 turns' timings, newest first.
          items: { $ref: "#/components/schemas/AdminTurnTiming" }
        activity:
          type: array
          description: The last 20 activity-log entries, newest first.
          items: { $ref: "#/components/schemas/AdminActivityEntry" }
        agent:
          type: object
          required: [runtime, effectiveRuntime, aiAccess, claudeConnected]
          properties:
            runtime: { $ref: "#/components/schemas/AgentRuntime" }
            effectiveRuntime: { type: [string, "null"], enum: [hermes, claude_code, null] }
            aiAccess: { type: string, enum: [claude_plan, own_key, platform, none] }
            claudeConnected: { type: boolean }
        container:
          description: The container's state from the vm-manager; null when it can't be asked.
          oneOf:
            - { $ref: "#/components/schemas/AgentStatus" }
            - { type: "null" }

    AdminPlanChange:
      type: object
      required: [userId, plan, previousPlan, changed, subscription]
      properties:
        userId: { type: string }
        plan: { $ref: "#/components/schemas/PlanId" }
        previousPlan: { $ref: "#/components/schemas/PlanId" }
        changed: { type: boolean }
        subscription:
          $ref: "#/components/schemas/Subscription"
          description: A running Polar subscription can set its own plan again at its next event.

    AgentRuntime:
      type: string
      enum: [hermes, claude_code]

    AiPreference:
      type: string
      enum: [auto, platform]
      description: |
        `auto`: the user's own AI when they have one (Claude plan, then API key), Textcrew AI
        otherwise. `platform`: Textcrew AI, paid in credits, even with a key saved or a Claude
        plan connected.

    AgentSettings:
      type: object
      required: [runtime, effectiveRuntime, aiAccess, aiPreference, platformAvailable, claude, ownKeyProviders, claudeModel, claudeEffort, claudeChoices]
      properties:
        runtime:
          $ref: "#/components/schemas/AgentRuntime"
        effectiveRuntime:
          type: [string, "null"]
          enum: [hermes, claude_code, null]
          description: What actually runs (null when there's no AI source)
        aiAccess:
          type: string
          enum: [claude_plan, own_key, platform, none]
          description: What pays for the AI right now (`platform` is Textcrew AI, paid in credits)
        aiPreference:
          $ref: "#/components/schemas/AiPreference"
          description: What the user chose. Ignored while `platformAvailable` is false.
        platformAvailable:
          type: boolean
          description: Textcrew AI is on offer on this deployment (`AI_ACCESS_MODE=platform`).
        claude:
          type: object
          required: [connected]
          properties:
            connected: { type: boolean }
            connectedAt: { type: [string, "null"], format: date-time }
        ownKeyProviders:
          type: array
          items: { $ref: "#/components/schemas/ByokProvider" }
        claudeModel:
          type: [string, "null"]
          description: |
            The Claude model Claude Code uses, one of `claudeChoices.models`. Null: Claude Code's
            own default. Applies when Claude Code is the engine.
          examples: [claude-opus-5-5]
        claudeEffort:
          type: [string, "null"]
          enum: [low, medium, high, xhigh, max, null]
          description: |
            How hard Claude Code thinks. Null: Claude Code's own default. Applies when Claude Code
            is the engine.
        claudeChoices:
          type: object
          description: |
            What may be chosen for `claudeModel` and `claudeEffort`, in display order: the current
            models first, then the older ones Claude still offers, newest first.
          required: [models, efforts]
          properties:
            models:
              type: array
              items:
                type: object
                required: [id, label, group, efforts]
                properties:
                  id: { type: string, examples: [claude-opus-5-5] }
                  label: { type: string, examples: [Opus 5.5] }
                  group:
                    type: string
                    enum: [current, older]
                    description: |
                      `current`: Claude's newest models. `older`: earlier models Claude still offers.
                  efforts:
                    type: array
                    items: { type: string, enum: [low, medium, high, xhigh, max] }
                    description: |
                      The effort levels this model takes, lowest first. Empty: the model has no
                      effort setting, so `claudeEffort` does not apply to it. A level the model
                      does not take runs at the nearest lower level it does take.
                    examples: [[low, medium, high, max]]
                  note:
                    type: string
                    description: A short word about the model worth showing next to it.
                    examples: ["Pro: paid with usage credits. Max: up to half your weekly limit, then usage credits."]
            efforts:
              type: array
              description: Every effort level, lowest first.
              items: { type: string, enum: [low, medium, high, xhigh, max] }
              examples: [[low, medium, high, xhigh, max]]

    ClaudeLoginStart:
      type: object
      required: [loginId, authorizeUrl, expiresAt]
      properties:
        loginId: { type: string }
        authorizeUrl: { type: string, format: uri, description: "Anthropic's sign-in page" }
        expiresAt: { type: string, format: date-time }

    ActivityEntry:
      type: object
      required: [id, actor, action, summary, createdAt]
      properties:
        id: { type: string }
        actor: { type: string, enum: [user, agent, admin, system] }
        action: { type: string, examples: [run_app_action, send_message, approval_requested, approval_decided, coupon_redeemed, channel_linked, channel_unlinked, web_search, web_search_refused, read_page, read_page_refused, crew_progress, browser_enabled, browser_disabled, pr_review_requested, remember, recall, forget, memory_refused, memory_deleted, memories_cleared, chat_started, conversation_deleted] }
        summary: { type: string }
        crew:
          type: [string, "null"]
          enum: [byte, patch, scout, null]
          description: The specialist this entry belongs to, when the platform knows it (progress lines).
        memoryId:
          type: [string, "null"]
          description: The memory this entry is about (`remember`, `forget`, `memory_deleted`). It may have been deleted since. Null for every other entry.
        creditsCharged:
          type: [integer, "null"]
          description: "Credits this entry cost. App actions: 1 if it changed something, 0 if it only read. Web search: 1 for a search that ran, 0 for one that did not. Null when nothing is charged per entry."
        createdAt: { type: string, format: date-time }

    StreamEvent:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: [message.created, message.status, approval.created, approval.resolved,
                 agent.status, agent.progress, credits.updated, automation.updated,
                 conversation.updated, conversation.deleted, message.draft]
        data:
          oneOf:
            - { $ref: "#/components/schemas/Message" }
            - { $ref: "#/components/schemas/MessageDraft" }
            - { $ref: "#/components/schemas/Conversation" }
            - { $ref: "#/components/schemas/ConversationDeleted" }
            - { $ref: "#/components/schemas/Approval" }
            - { $ref: "#/components/schemas/AgentStatus" }
            - { $ref: "#/components/schemas/AgentProgress" }
            - { $ref: "#/components/schemas/CreditBalance" }
            - { $ref: "#/components/schemas/Automation" }
